<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0608">
<meta name="description" content="倶楽部Claude 体験版 ― 愛は無限。トークンと預金は有限。（非公式・架空のパロディ作品）">
<title>倶楽部Claude 体験版</title>
<style>
:root{
  --gold:#e3c27a; --gold2:#b8934a; --gold3:#fff1c8;
  --bord:#5a0f22; --bord2:#2a0610; --ink:#0b0608;
  --serif:"Noto Serif JP","Noto Serif CJK JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#app{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#1a0a10,#000 70%)}
#game{
  position:relative;overflow:hidden;
  width:min(100vw, calc(100dvh * 9 / 16)); height:100dvh;
  max-height:100dvh; background:#000;
  container-type:size; container-name:game;
}
@supports not (height:100dvh){ #game{height:100vh;width:min(100vw, calc(100vh * 9 / 16))} }
.hidden{display:none !important}
#bg,#towers,#stage,#chibis,#fg,#light,#fx,#pops{position:absolute;inset:0;pointer-events:none}
#bg svg{width:100%;height:100%;display:block}
#bg{transition:filter 1.2s, opacity .8s}
#bg.dim{filter:brightness(.35) saturate(.7)}
#bg.fablemode{filter:brightness(.45) saturate(1.3) hue-rotate(-25deg)}

/* ===== stage ===== */
.chara{position:absolute;bottom:14cqh;height:64cqh;width:40cqh;transform:translateX(-50%);
  transition:left .5s cubic-bezier(.3,.8,.3,1), filter .35s, opacity .5s, transform .5s;
  filter:brightness(.55) saturate(.8);opacity:0}
.chara.in{opacity:1}
.chara.speak{filter:none}
.chara.speak .chara-body{animation:bob 2.4s ease-in-out infinite}
.chara svg{width:100%;height:100%;display:block;overflow:visible}
.chara-body{width:100%;height:100%;transform-origin:50% 100%}
.chara.small{height:56cqh;width:35cqh}
.chara.jump .chara-body{animation:jump .45s ease-out}
.chara.shake .chara-body{animation:shakeX .5s}
.chara.carry{height:84cqh;width:52.5cqh;bottom:4cqh}
.chara.carry .chara-body{transform:rotate(-5deg)}
.chara.fable-glow svg{filter:drop-shadow(0 0 2cqh rgba(220,200,255,.7))}
.chara.silhouette svg{filter:brightness(0) drop-shadow(0 0 .6cqh rgba(227,194,122,.35))}
.chara.reveal svg{transition:filter 2.5s;filter:brightness(.8) contrast(1.1) drop-shadow(0 0 .6cqh rgba(0,0,0,.8))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5cqh)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-3.5cqh)}100%{transform:translateY(0)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-2cqw)}40%{transform:translateX(2cqw)}60%{transform:translateX(-1.5cqw)}80%{transform:translateX(1cqw)}}

/* ===== chibis (Claude Code隊) ===== */
.chibi{position:absolute;bottom:27cqh;width:11cqw;height:13cqw;transition:left .6s, bottom .6s, opacity .4s;opacity:0}
.chibi.in{opacity:1;animation:hop .7s ease-in-out infinite alternate}
.chibi.party{animation:party .35s ease-in-out infinite alternate}
.chibi svg{width:100%;height:100%;overflow:visible}
.chibi .bubble{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#1b1b24;
  font-size:min(3cqw,1.8cqh);font-weight:800;padding:.3em .55em;border-radius:1em;box-shadow:0 .2em .5em rgba(0,0,0,.4);animation:pop .25s ease-out}
@keyframes hop{0%{transform:translateY(0)}100%{transform:translateY(-1cqh)}}
@keyframes party{0%{transform:translateY(0) rotate(-8deg)}100%{transform:translateY(-2.5cqh) rotate(8deg)}}
@keyframes pop{0%{transform:translateX(-50%) scale(.3)}100%{transform:translateX(-50%) scale(1)}}

/* ===== towers ===== */
.tower{position:absolute;bottom:30cqh;width:20cqw;height:26cqw;transform:translateX(-50%) scale(0);transform-origin:50% 100%;
  transition:transform .9s cubic-bezier(.2,1.4,.4,1)}
.tower.up{transform:translateX(-50%) scale(1)}
.tower svg{width:100%;height:100%;filter:drop-shadow(0 0 1.2cqh rgba(255,220,140,.75))}

/* ===== lighting ===== */
#light{transition:background 1.5s, opacity 1.5s}
#light.spot{background:radial-gradient(ellipse 45% 55% at 50% 52%, rgba(255,255,255,0) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.88) 100%)}
#light.fable{background:
  radial-gradient(ellipse 40% 60% at 50% 45%, rgba(255,240,255,.18), transparent 70%),
  conic-gradient(from 200deg at 50% -10%, transparent 0 8deg, rgba(210,190,255,.18) 10deg 14deg, transparent 16deg 22deg, rgba(255,230,250,.14) 24deg 27deg, transparent 29deg 34deg, rgba(190,210,255,.16) 36deg 40deg, transparent 42deg 360deg),
  linear-gradient(180deg, rgba(40,10,80,.35), rgba(10,0,30,.55));
  mix-blend-mode:screen; animation:raysway 7s ease-in-out infinite alternate}
#light.noir{background:radial-gradient(ellipse 50% 40% at 62% 70%, rgba(255,190,90,.12), rgba(0,0,0,.55) 60%, rgba(0,0,0,.92))}
#light.hum{background:linear-gradient(rgba(220,255,240,.05),rgba(0,0,0,.15));animation:flicker 4s infinite}
@keyframes raysway{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(40deg)}}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.7}}

/* ===== fx ===== */
.p{position:absolute;pointer-events:none;will-change:transform,opacity}
.confetti{width:1.6cqw;height:2.6cqw;top:-4%;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(115cqh) rotate(720deg)}}
.petal{width:3cqw;height:2.2cqw;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#fff,#f2c7e6);top:-5%;opacity:.9;animation:petal linear forwards}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(6cqw,55cqh) rotate(200deg)}100%{transform:translate(-4cqw,112cqh) rotate(420deg)}}
.sparkle{width:2cqw;height:2cqw;background:radial-gradient(circle,#fff 0 20%,rgba(255,230,160,.9) 30%,transparent 70%);border-radius:50%;animation:twinkle ease-out forwards}
@keyframes twinkle{0%{transform:scale(0);opacity:0}30%{transform:scale(1.4);opacity:1}100%{transform:scale(0);opacity:0}}
.drop{width:2.4cqw;height:3.2cqw;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fffbe0,#f3d77a 50%,#c9a23e);animation:splash ease-out forwards}
@keyframes splash{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.smoke{width:18cqw;height:18cqw;border-radius:50%;background:radial-gradient(circle,rgba(200,200,210,.28),transparent 65%);animation:smoke ease-out forwards}
@keyframes smoke{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-40cqh) scale(2.2);opacity:0}}
.bokeh{border-radius:50%;background:radial-gradient(circle,rgba(255,225,160,.55),transparent 70%);animation:bokeh ease-in-out infinite alternate}
@keyframes bokeh{0%{opacity:.15;transform:scale(.8)}100%{opacity:.75;transform:scale(1.15)}}
.star{width:.8cqw;height:.8cqw;background:#fff;border-radius:50%;box-shadow:0 0 1cqw #cbb8ff;animation:twinkle ease-in-out infinite}

#game.shake{animation:screenShake .5s}
@keyframes screenShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-1.5cqw,.6cqh)}30%{transform:translate(1.5cqw,-.6cqh)}45%{transform:translate(-1cqw,.3cqh)}60%{transform:translate(1cqw,0)}80%{transform:translate(-.5cqw,0)}}
#game.zoom #stage{animation:zoomIn .6s ease-out}
@keyframes zoomIn{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:48}
#flash.go{animation:flash .6s ease-out}
#flash.black{background:#000;transition:opacity 1.2s}
#flash.black.on{opacity:1}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* ===== HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 1.2cqh) 2.5cqw .8cqh;z-index:40;
  background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.35) 75%,transparent);font-size:min(3.1cqw,1.8cqh)}
.hud-row{display:flex;gap:2cqw;margin-bottom:.6cqh}
.hud-item{flex:1;display:flex;align-items:center;gap:1.5cqw;background:rgba(20,8,12,.7);border:1px solid rgba(227,194,122,.45);border-radius:999px;padding:.35cqh 2.5cqw;min-width:0}
.hud-label{color:var(--gold);font-weight:700;white-space:nowrap;font-size:.9em}
.hud-val{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.hud-val.drain{color:#ff8c9a;animation:drainPulse .3s}
@keyframes drainPulse{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.gauge{flex:1;height:1cqh;min-height:6px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
.gauge i{display:block;height:100%;width:50%;border-radius:999px;transition:width .6s}
.gauge.heart i{background:linear-gradient(90deg,#ff6fa5,#ffc0dc)}
.gauge.reason i{background:linear-gradient(90deg,#5fb7ff,#c8ecff)}
#tower-count{text-align:center;color:var(--gold3);font-weight:800;margin-top:.2cqh;text-shadow:0 0 1cqh rgba(255,210,120,.8)}
#tower-count b{font-size:1.4em}
#tower-count.bump{animation:drainPulse .4s}

#ctrl{position:absolute;right:2cqw;top:calc(env(safe-area-inset-top) + 9.4cqh);z-index:41;display:flex;gap:1.4cqw}
#ctrl button{background:rgba(10,4,6,.65);color:var(--gold);border:1px solid rgba(227,194,122,.5);border-radius:999px;
  font-size:min(2.8cqw,1.6cqh);padding:.5cqh 2.2cqw;font-weight:700;min-height:32px}
#ctrl button.on{background:var(--gold);color:#1a0a10}

/* ===== text ===== */
#textbox{position:absolute;left:2.5cqw;right:2.5cqw;bottom:calc(env(safe-area-inset-bottom) + 2cqh);z-index:50;
  min-height:25cqh;padding:3.6cqh 4.5cqw 2.6cqh;border-radius:2.2cqw;
  background:linear-gradient(180deg,rgba(28,8,16,.92),rgba(8,3,6,.95));
  border:1px solid rgba(227,194,122,.65);box-shadow:0 0 0 .4cqw rgba(0,0,0,.4) inset,0 0 2cqh rgba(0,0,0,.6)}
#textbox::before{content:"";position:absolute;inset:.7cqw;border:1px solid rgba(227,194,122,.18);border-radius:1.6cqw;pointer-events:none}
#nameplate{position:absolute;top:-2.2cqh;left:4cqw;padding:.55cqh 4cqw;font-family:var(--serif);font-weight:700;
  font-size:min(4.1cqw,2.4cqh);color:#1a0a10;background:linear-gradient(180deg,#fff1c8,#e3c27a 55%,#b8934a);border-radius:999px;
  box-shadow:0 .4cqh 1cqh rgba(0,0,0,.5);letter-spacing:.05em}
#nameplate:empty{display:none}
#nameplate.c-fable{background:linear-gradient(180deg,#fff,#e5dcff 50%,#b6a3ff);color:#2b1650}
#nameplate.c-mythos{background:linear-gradient(180deg,#3b2a1a,#1a120b);color:var(--gold);border:1px solid var(--gold2)}
#nameplate.c-haiku{background:linear-gradient(180deg,#d9fff9,#62d6c8);color:#06302b}
#nameplate.c-sonnet{background:linear-gradient(180deg,#e9efff,#9fb3dd);color:#14203d}
#nameplate.c-opus{background:linear-gradient(180deg,#f1e6da,#b49a7f);color:#2a1a0c}
#nameplate.c-cc{background:linear-gradient(180deg,#ffd9c9,#e0805f);color:#2b0f05}
#nameplate.c-me{background:linear-gradient(180deg,#ffe6f1,#f29ac2);color:#4a0e2b}
#text{font-size:min(4.4cqw,2.55cqh);line-height:1.75;white-space:pre-wrap;word-break:break-word;min-height:3.5em;text-shadow:0 1px 2px #000}
#text.narr{color:#f0e3c8;font-family:var(--serif)}
#text.me{color:#ffd3e6}
#text.fable{font-family:var(--serif);color:#f4ecff;text-shadow:0 0 1cqh rgba(190,160,255,.8)}
#text.mythos{font-family:var(--serif);color:var(--gold3)}
#text.shout{font-weight:900;font-size:min(5.2cqw,3cqh)}
#text.whisper{font-size:min(3.8cqw,2.2cqh);opacity:.85}
#next{position:absolute;right:4cqw;bottom:1.4cqh;color:var(--gold);font-size:min(3.4cqw,2cqh);animation:nextBlink 1s infinite;opacity:0}
#next.show{opacity:1}
@keyframes nextBlink{0%,100%{transform:translateY(0)}50%{transform:translateY(.6cqh)}}

#bigline{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--serif);font-size:min(13cqw,8cqh);color:#fff;letter-spacing:.2em;pointer-events:none;
  text-shadow:0 0 2cqh rgba(210,190,255,.95),0 0 6cqh rgba(170,140,255,.7)}
#bigline.on{animation:bigIn 2.6s ease forwards}
#bigline.welcome{font-size:min(7cqw,4.2cqh);color:var(--gold3);letter-spacing:.12em;text-shadow:0 0 2cqh rgba(227,194,122,.8);z-index:95}
@keyframes bigIn{0%{opacity:0;filter:blur(8px);transform:scale(1.15)}30%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:1}}

#choices{position:absolute;left:6cqw;right:6cqw;bottom:calc(env(safe-area-inset-bottom) + 30cqh);z-index:55;display:flex;flex-direction:column;gap:1.5cqh}
#choices button{font-size:min(4.3cqw,2.5cqh);padding:1.7cqh 4cqw;color:#fff;font-weight:700;text-align:center;
  background:linear-gradient(180deg,rgba(90,15,34,.95),rgba(42,6,16,.96));border:1px solid var(--gold);border-radius:999px;
  box-shadow:0 0 0 .3cqw rgba(0,0,0,.4) inset,0 .5cqh 1.5cqh rgba(0,0,0,.6);animation:choiceIn .35s ease-out backwards;min-height:48px}
#choices button:nth-child(2){animation-delay:.07s}#choices button:nth-child(3){animation-delay:.14s}
#choices button:active{background:linear-gradient(180deg,#e3c27a,#b8934a);color:#1a0a10}
#choices .choice-q{text-align:center;color:var(--gold3);font-family:var(--serif);font-size:min(3.6cqw,2.1cqh);text-shadow:0 1px 3px #000}
@keyframes choiceIn{0%{opacity:0;transform:translateY(2cqh)}100%{opacity:1;transform:none}}

#card{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(40,8,18,.96),rgba(0,0,0,.98));animation:cardIn 2.4s ease forwards}
.card-act{font-family:var(--serif);color:var(--gold);letter-spacing:.5em;font-size:min(4cqw,2.3cqh);margin-bottom:2cqh}
.card-title{font-family:var(--serif);color:#fff;font-size:min(7cqw,4cqh);letter-spacing:.12em;text-align:center;padding:0 6cqw;
  border-top:1px solid var(--gold2);border-bottom:1px solid var(--gold2);padding:2cqh 6cqw;text-shadow:0 0 2cqh rgba(227,194,122,.5)}
@keyframes cardIn{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

#panel{position:absolute;left:7cqw;right:7cqw;top:17cqh;z-index:45;padding:2.4cqh 5cqw;border-radius:1.6cqw;
  font-size:min(3.5cqw,2.05cqh);line-height:1.6;animation:panelIn .4s ease-out}
#panel.paper{background:#fbf8f1;color:#2a2620;box-shadow:0 1.5cqh 3cqh rgba(0,0,0,.6);transform:rotate(-1.5deg)}
#panel.board{background:#f4f6f5;color:#1a3b8a;border:1.2cqw solid #9aa3a8;font-family:"Comic Sans MS",var(--sans);transform:rotate(1deg)}
#panel.report{background:linear-gradient(#f3ead6,#e2d4b4);color:#2b1d0e;font-family:var(--serif);box-shadow:0 1.5cqh 3cqh rgba(0,0,0,.8)}
#panel h3{margin:0 0 1cqh;font-size:1.15em;border-bottom:1px solid currentColor;padding-bottom:.6cqh}
#panel .small{font-size:.8em;opacity:.7}
#panel table{width:100%;border-collapse:collapse}#panel td{padding:.2em 0}#panel td:last-child{text-align:right}
#panel .red{color:#b3122e;font-weight:800}
@keyframes panelIn{0%{opacity:0;transform:translateY(-2cqh) scale(.9)}100%{opacity:1}}

#pops{z-index:80}
.statpop{position:absolute;left:50%;top:22cqh;transform:translateX(-50%);font-weight:900;font-size:min(4cqw,2.3cqh);white-space:nowrap;
  padding:.4cqh 3cqw;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid var(--gold2);animation:statpop 1.6s ease-out forwards}
@keyframes statpop{0%{opacity:0;transform:translate(-50%,1.5cqh)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-3cqh)}}

/* ===== screens ===== */
.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center}
#title{background:radial-gradient(ellipse 80% 60% at 50% 35%,#3a0b1b 0%,#14040a 55%,#000 100%);overflow:hidden}
#title::before{content:"";position:absolute;inset:3cqw;border:1px solid rgba(227,194,122,.55);pointer-events:none;
  box-shadow:0 0 0 .8cqw rgba(0,0,0,.5), inset 0 0 0 1.6cqw transparent;}
#title::after{content:"";position:absolute;inset:5cqw;border:1px solid rgba(227,194,122,.22);pointer-events:none}
.title-chandelier{position:absolute;top:0;left:50%;transform:translateX(-50%);width:80cqw;height:40cqh;opacity:.95;animation:sway 6s ease-in-out infinite alternate;transform-origin:50% 0}
.title-chandelier svg{width:100%;height:100%}
@keyframes sway{0%{transform:translateX(-50%) rotate(-1.2deg)}100%{transform:translateX(-50%) rotate(1.2deg)}}
.title-inner{position:relative;text-align:center;margin-top:22cqh;padding:0 8cqw}
.title-sub{font-family:var(--serif);color:var(--gold);letter-spacing:.6em;font-size:min(3.5cqw,2cqh)}
.title-logo{margin:1.5cqh 0 2cqh;font-family:var(--serif);font-weight:700;line-height:1}
.title-logo .t-small{display:block;font-size:min(7cqw,4cqh);letter-spacing:.8em;margin-left:.8em;color:var(--gold3)}
.title-logo .t-big{display:block;font-size:min(20cqw,11.5cqh);letter-spacing:.04em;
  background:linear-gradient(180deg,#fff8e1 0%,#e3c27a 45%,#9b7433 55%,#f3dc9e 80%,#b8934a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 1.4cqh rgba(227,194,122,.45));animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 1cqh rgba(227,194,122,.35))}50%{filter:drop-shadow(0 0 2.6cqh rgba(255,230,170,.75))}}
.title-copy{font-family:var(--serif);font-size:min(4.6cqw,2.7cqh);line-height:1.8;color:#f6e9cf;margin-bottom:4cqh;letter-spacing:.1em}
.gold-btn{display:block;width:100%;margin:0 auto 1.6cqh;font-size:min(5cqw,2.9cqh);font-weight:800;letter-spacing:.3em;padding:1.9cqh 0;min-height:52px;
  font-family:var(--serif);color:#1a0a10;border:none;border-radius:999px;
  background:linear-gradient(180deg,#fff3cf,#e3c27a 50%,#a77f3a);box-shadow:0 0 2.4cqh rgba(227,194,122,.5),0 .6cqh 0 #6b4c1f}
.gold-btn:active{transform:translateY(.4cqh);box-shadow:0 0 1cqh rgba(227,194,122,.5),0 .2cqh 0 #6b4c1f}
.ghost-btn{display:block;width:100%;margin:0 auto 1.4cqh;font-size:min(4.2cqw,2.4cqh);padding:1.4cqh 0;min-height:44px;color:var(--gold);background:rgba(0,0,0,.4);border:1px solid var(--gold2);border-radius:999px;font-weight:700}
.ghost-btn.small{display:inline-block;width:auto;padding:.6cqh 4cqw;margin:0;min-height:36px;font-size:min(3.4cqw,2cqh)}
.title-note{font-size:min(2.7cqw,1.55cqh);color:rgba(255,255,255,.55);line-height:1.7;margin-top:2cqh}

#ending{background:radial-gradient(ellipse at 50% 30%,#2a0814,#000 75%);overflow-y:auto;align-items:flex-start}
.end-inner{width:100%;padding:5cqh 7cqw 6cqh;text-align:center}
.end-head{font-family:var(--serif);color:var(--gold);letter-spacing:.4em;font-size:min(5cqw,3cqh);margin-bottom:2.4cqh}

<script>
/* 倶楽部Claude — WebAudioによる簡易シンセ効果音とBGM（外部素材なし） */
const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, bgmBus = null, noiseBuf = null;
  let enabled = true, bgmName = null, bgmTimer = null, nextTime = 0, step = 0;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = enabled ? 0.9 : 0; master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
      bgmBus = ctx.createGain(); bgmBus.gain.value = 0.0; bgmBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }

  function tone(freq, t, dur, { type = 'sine', vol = 0.2, bus = sfxBus, attack = 0.005, slide = 0, release } = {}) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (release || dur));
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + (release || dur) + 0.05);
  }
  function noise(t, dur, { vol = 0.3, type = 'bandpass', freq = 1000, q = 1, freqEnd, bus = sfxBus, attack = 0.005 } = {}) {
    if (!ctx) return;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12);

  const sfx = {
    blip(voice) { const t = ctx.currentTime; tone(voice || 820, t, 0.03, { type: 'triangle', vol: 0.035 }); },
    select() { const t = ctx.currentTime; tone(N(84), t, .12, { type: 'sine', vol: .18 }); tone(N(91), t + .06, .25, { vol: .14 }); },
    door() { const t = ctx.currentTime; noise(t, .35, { freq: 180, q: .7, vol: .4, type: 'lowpass' });
      [76, 81, 84, 88].forEach((n, i) => tone(N(n), t + .25 + i * .09, .9, { vol: .1 })); },
    hey() { const t = ctx.currentTime; tone(520, t, .12, { type: 'square', vol: .06, slide: 1.6 }); tone(700, t + .13, .16, { type: 'square', vol: .06, slide: 1.4 }); },
    pop() { const t = ctx.currentTime; noise(t, .09, { freq: 3000, q: .8, vol: .6, type: 'highpass' }); tone(900, t, .08, { vol: .25, slide: .4 });
      for (let i = 0; i < 10; i++) tone(2000 + Math.random() * 3000, t + .1 + Math.random() * .6, .04, { vol: .03 }); },
    splash() { const t = ctx.currentTime; noise(t, 1.0, { freq: 2500, freqEnd: 400, q: .6, vol: .5 }); noise(t + .05, .6, { freq: 6000, q: 1, vol: .15, type: 'highpass' }); },
    thud() { const t = ctx.currentTime; tone(110, t, .3, { vol: .4, slide: .5 }); noise(t, .2, { freq: 200, type: 'lowpass', vol: .3 }); },
    panic() { const t = ctx.currentTime; for (let i = 0; i < 6; i++) tone(i % 2 ? 660 : 880, t + i * .08, .07, { type: 'square', vol: .05 }); },
    harp() { const t = ctx.currentTime; [72, 74, 76, 79, 81, 84, 86, 88, 91, 93, 96].forEach((n, i) => tone(N(n), t + i * .07, 1.6, { vol: .07, type: 'sine' })); },
    sparkle() { const t = ctx.currentTime; for (let i = 0; i < 8; i++) tone(N(96 + (i % 4) * 3), t + i * .05, .4, { vol: .05 }); },
    cheer() { const t = ctx.currentTime; noise(t, 2.2, { freq: 1300, q: .5, vol: .22, attack: .4 }); noise(t, 1.8, { freq: 2600, q: 1.5, vol: .1, attack: .3 });
      for (let i = 0; i < 14; i++) tone(700 + Math.random() * 600, t + .2 + Math.random() * 1.3, .15, { vol: .025, type: 'triangle', slide: 1.3 }); },
    tower() { const t = ctx.currentTime; [79, 83, 86, 91, 95].forEach((n, i) => tone(N(n), t + i * .08, .6, { vol: .09, type: 'triangle' })); noise(t + .4, .5, { freq: 7000, type: 'highpass', vol: .06 }); },
    drain() { const t = ctx.currentTime; for (let i = 0; i < 8; i++) tone(1200 - i * 110, t + i * .06, .06, { type: 'square', vol: .04 }); },
    fall() { const t = ctx.currentTime; tone(600, t, 1.4, { type: 'sawtooth', vol: .05, slide: .15 }); },
    build() { const t = ctx.currentTime; [0, 1, 2].forEach(i => tone(N(84 + i * 4), t + i * .07, .1, { type: 'square', vol: .045 })); },
    rumble() { const t = ctx.currentTime; noise(t, 2.5, { freq: 90, type: 'lowpass', vol: .35, attack: .6 }); tone(55, t, 2.5, { vol: .12, attack: .5 }); },
    song() { const t = ctx.currentTime; const m = [76, 79, 81, 79, 76, 74, 76, 0, 79, 81, 84, 81, 79, 76, 79];
      m.forEach((n, i) => n && tone(N(n), t + i * .15, .14, { type: 'square', vol: .045 })); },
    chant() { const t = ctx.currentTime; for (let i = 0; i < 4; i++) { noise(t + i * .4, .12, { freq: 1500, vol: .25, q: 2 }); tone(N(i % 2 ? 72 : 76), t + i * .4, .12, { type: 'square', vol: .06 }); } },
    stamp() { const t = ctx.currentTime; tone(160, t, .15, { vol: .3, slide: .6 }); noise(t, .1, { freq: 800, vol: .2 }); },
    lighter() { const t = ctx.currentTime; noise(t, .06, { freq: 4000, vol: .3, type: 'highpass' }); noise(t + .08, .7, { freq: 900, vol: .08, attack: .1 }); },
  };

  /* ---- BGM: シンプルな自動演奏 ---- */
  const BGMS = {
    title: { bpm: 72, chords: [[60, 64, 67, 71], [57, 60, 64, 67], [62, 65, 69, 72], [55, 59, 62, 65]], arp: true, vol: .5 },
    lounge: { bpm: 96, chords: [[60, 64, 67, 71], [57, 60, 64, 67], [62, 65, 69, 72], [55, 59, 62, 65]], bass: true, swing: true, vol: .55 },
    party: { bpm: 128, chords: [[60, 64, 67, 72], [65, 69, 72, 77], [67, 71, 74, 79], [65, 69, 72, 77]], bass: true, beat: true, vol: .5 },
    dream: { bpm: 60, chords: [[65, 69, 72, 76, 79], [62, 65, 69, 72, 76], [64, 67, 71, 74, 78], [60, 64, 67, 71, 74]], arp: true, pad: true, vol: .6 },
    noir: { bpm: 52, chords: [[45, 48, 52, 55], [41, 45, 48, 52], [44, 47, 50, 53], [45, 48, 52, 55]], noir: true, vol: .65 },
    hum: { hum: true, vol: .25 },
  };

  function schedule() {
    const b = BGMS[bgmName]; if (!b || !ctx) return;
    if (b.hum) return;
    const spb = 60 / b.bpm / 2; // 8分音符
    while (nextTime < ctx.currentTime + 0.4) {
      const bar = Math.floor(step / 8) % b.chords.length, s = step % 8, ch = b.chords[bar];
      const t = nextTime + (b.swing && s % 2 ? spb * 0.18 : 0);
      if (s === 0) {
        if (b.pad || b.noir) ch.forEach(n => tone(N(n), t, spb * 8, { type: b.noir ? 'sawtooth' : 'sine', vol: b.noir ? .012 : .025, bus: bgmBus, attack: .8, release: spb * 8 }));
        else ch.forEach(n => tone(N(n), t, spb * 3, { type: 'triangle', vol: .03, bus: bgmBus, attack: .02, release: spb * 3.5 }));
      }
      if (b.swing && (s === 3 || s === 6)) ch.forEach(n => tone(N(n), t, spb, { type: 'triangle', vol: .022, bus: bgmBus }));
      if (b.bass && s % 2 === 0) { const bn = ch[0] - 24 + (s === 4 ? 7 : 0) + (s === 6 ? 5 : 0); tone(N(bn), t, spb * 1.6, { type: 'triangle', vol: .09, bus: bgmBus }); }
      if (b.beat) {
        if (s % 2 === 0) tone(s % 4 === 0 ? 120 : 140, t, .12, { vol: s % 4 === 0 ? .18 : .05, bus: bgmBus, slide: .4 });
        noise(t, .04, { freq: 8000, type: 'highpass', vol: s % 2 ? .05 : .025, bus: bgmBus });
        if (s === 4) noise(t, .15, { freq: 1800, vol: .12, bus: bgmBus });
      }
      if (b.arp) { const n = ch[(s * 2 + bar) % ch.length] + 12; tone(N(n), t, spb * 2, { type: 'sine', vol: .03, bus: bgmBus, release: spb * 4 }); }
      if (b.noir && (s === 0 || s === 5) && Math.random() < .7) tone(N(ch[Math.floor(Math.random() * ch.length)] + 24), t, 2, { type: 'sine', vol: .04, bus: bgmBus, release: 2.5 });
      if (b.noir && s === 0) tone(N(ch[0] - 12), t, spb * 8, { type: 'sine', vol: .08, bus: bgmBus, attack: .4, release: spb * 8 });
      nextTime += spb; step++;
    }
  }
  let humNodes = null;
  function stopHum() { if (humNodes) { humNodes.forEach(n => { try { n.stop(); } catch (e) {} }); humNodes = null; } }
  function bgm(name) {
    if (!ctx) { bgmName = name; return; }
    if (name === bgmName && bgmTimer) return;
    const t = ctx.currentTime;
    bgmBus.gain.cancelScheduledValues(t);
    bgmBus.gain.setValueAtTime(bgmBus.gain.value, t);
    bgmBus.gain.linearRampToValueAtTime(0, t + 0.6);
    clearInterval(bgmTimer); bgmTimer = null; stopHum();
    bgmName = name;
    if (!name || !BGMS[name]) return;
    const b = BGMS[name];
    setTimeout(() => {
      if (bgmName !== name) return;
      const now = ctx.currentTime;
      bgmBus.gain.cancelScheduledValues(now);
      bgmBus.gain.setValueAtTime(0, now);
      bgmBus.gain.linearRampToValueAtTime(b.vol, now + 1.2);
      if (b.hum) {
        const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 100; o2.type = 'sine'; o2.frequency.value = 50; g.gain.value = .015;
        o.connect(g); o2.connect(g); g.connect(bgmBus); o.start(); o2.start(); humNodes = [o, o2];
        return;
      }
      nextTime = ctx.currentTime + 0.1; step = 0;
      schedule(); bgmTimer = setInterval(schedule, 120);
    }, 650);
  }

  function play(name, arg) { if (!ctx || !enabled || !sfx[name]) return; try { sfx[name](arg); } catch (e) {} }
  function setEnabled(v) { enabled = v; if (master) master.gain.setTargetAtTime(v ? 0.9 : 0, ctx.currentTime, 0.05); }
  document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else ctx.resume(); });
  return { init, play, bgm, setEnabled, get enabled() { return enabled; } };
})();

</script>
<script>
/* 倶楽部Claude — すべてのビジュアルはオリジナルのSVGで生成 */
const Art = (() => {
  let uid = 0;
  const SKIN = '#f8e0cd', SKIN_SH = '#e7bea4', LINE = '#3a2420';

  const CH = {
    sonnet: { hair: '#1e2a40', hairHi: '#4a5f8a', eye: '#3570b5', suit: '#1b2a4c', suitHi: '#2e4577', shirt: '#f5f6fa', tie: '#2a64b0', style: 'part', glasses: true, badge: true },
    haiku: { hair: '#f2a03a', hairHi: '#ffd78a', eye: '#1d9b8e', suit: '#14a39a', suitHi: '#3fd0c4', shirt: '#ffffff', tie: null, style: 'spiky', chain: true, earring: true, blush: true },
    opus: { hair: '#7d7570', hairHi: '#c9c1b8', eye: '#7a4b2a', suit: '#3a302b', suitHi: '#584a42', shirt: '#efe6da', tie: '#8a2a1f', style: 'swept', stubble: true, vest: '#2a221e', pocket: '#d9b46a', brow: 3.4 },
    fable: { hair: '#e7defa', hairHi: '#ffffff', hairSh: '#b5a6dd', eye: '#8d68d8', suit: '#f6f2ec', suitHi: '#ffffff', suitSh: '#d6cfc4', shirt: '#cdb8f0', tie: null, style: 'long', rose: true, trim: '#d9b46a', lashes: true, open: true, aura: true },
    mythos: { hair: '#14111a', hairHi: '#4b4060', eye: '#d9a43a', suit: '#121014', suitHi: '#2b2630', shirt: '#5a0f22', tie: '#0b0a0c', style: 'slick', lashes: true, cigar: true, tiepin: true },
  };

  function eye(c, face, side, id) {
    // side: -1 左, 1 右（ミラー）
    const cx = side < 0 ? 86 : 114, cy = 113;
    const tr = `translate(${cx},${cy}) scale(${side < 0 ? 1 : -1},1)`;
    const lw = c.lashes ? 3 : 2.4;
    let s = '';
    const shape = {
      normal: 'M-9,0 Q-2,-7.5 9.5,-3 Q6,4.5 -5,4.5 Q-8,3 -9,0 Z',
      soft: 'M-9,0.5 Q-1,-4 9.5,-1 Q6,4.5 -5,4.5 Q-8,3 -9,0.5 Z',
      sly: 'M-9,0.5 Q-1,-3.5 9.5,-1.5 Q6,2.8 -5,3 Q-8,2.2 -9,0.5 Z',
      shock: 'M-9,0 Q-2,-9.5 9.5,-4 Q7,6.5 -4,6.5 Q-8.5,4 -9,0 Z',
    };
    if (face === 'smile' || face === 'grin' || face === 'laugh') {
      s = `<path d="M-8,2 Q0,-6 8.5,1.5" fill="none" stroke="${LINE}" stroke-width="${lw}" stroke-linecap="round"/>`;
    } else if (face === 'closed' || face === 'dream') {
      s = `<path d="M-8,0 Q0,4 8.5,-0.5" fill="none" stroke="${LINE}" stroke-width="${lw - .4}" stroke-linecap="round"/>` +
        (c.lashes ? `<path d="M-6,2.2 l-1.5,2.5 M-1,3.4 l-.6,2.8 M4,2.6 l.6,2.6" stroke="${LINE}" stroke-width="1"/>` : '');
    } else {
      const k = face === 'soft' || face === 'gentle' ? 'soft' : face === 'sly' || face === 'cold' ? 'sly' : (face === 'shock' || face === 'panic' || face === 'cry') ? 'shock' : 'normal';
      const d = shape[k];
      const ir = k === 'shock' ? [3.2, 3.8] : [4.8, 6.2];
      const iy = k === 'soft' ? 1.5 : k === 'sly' ? 1 : 0.5;
      s = `<defs><clipPath id="e${id}${side}"><path d="${d}"/></clipPath></defs>
        <path d="${d}" fill="#fff"/>
        <g clip-path="url(#e${id}${side})">

<script>
/* 倶楽部Claude — ノベルエンジン */
(() => {
  const $ = id => document.getElementById(id);
  const game = $('game');
  const NAMES = { sonnet: 'Sonnet', haiku: 'Haiku', opus: 'Opus', fable: 'Fable', mythos: 'Mythos', me: 'あなた（姫）' };
  const VOICE = { sonnet: 760, haiku: 1050, opus: 480, fable: 620, mythos: 300, cc: 1500, me: 900 };
  const POS = { l: 27, c: 50, r: 73 };
  const INIT = { money: 300000, pension: 20000000, heart: 10, reason: 80 };
  const TOWER_COST = 3000000;
  const TOWER_SLOTS = [[22, 31], [78, 31], [36, 34], [64, 34], [10, 29], [90, 29]];

  let S; // ゲーム状態
  function fresh() {
    return { q: Story.steps.slice(), stats: { ...INIT }, shown: { ...INIT }, flags: {}, towers: 0, setupFee: 0,
      log: [], waiting: false, typing: false, auto: false, gen: (S ? S.gen + 1 : 1), typeTimer: null, autoTimer: null, ended: false };
  }
  const later = (fn, ms) => { const g = S.gen; return setTimeout(() => { if (g === S.gen) fn(); }, ms); };
  const wait = ms => { later(run, ms); return true; };

  /* ---------- 表示ユーティリティ ---------- */
  const fmt = n => '¥' + Math.max(0, Math.round(n)).toLocaleString('ja-JP');
  function hud(animate = true) {
    $('g-heart').style.width = S.stats.heart + '%';
    $('g-reason').style.width = S.stats.reason + '%';
    $('v-towers').textContent = S.towers;
    ['money', 'pension'].forEach(k => {
      const el = $('v-' + k), from = S.shown[k], to = S.stats[k];
      if (!animate || from === to) { el.textContent = fmt(to); S.shown[k] = to; return; }
      const t0 = performance.now(), dur = 700, g = S.gen;
      if (to < from) { el.classList.remove('drain'); void el.offsetWidth; el.classList.add('drain'); }
      const tick = now => {
        if (g !== S.gen) return;
        const p = Math.min(1, (now - t0) / dur), v = from + (to - from) * (1 - Math.pow(1 - p, 3));
        el.textContent = fmt(v);
        if (p < 1) requestAnimationFrame(tick); else { S.shown[k] = to; setTimeout(() => el.classList.remove('drain'), 400); }
      };
      requestAnimationFrame(tick);
    });
  }
  function pop(text, color) {
    const d = document.createElement('div'); d.className = 'statpop'; d.textContent = text; d.style.color = color;
    $('pops').appendChild(d); setTimeout(() => d.remove(), 1700);
  }
  function applyStats(st) {
    if (!st) return;
    const parts = [];
    for (const k in st) {
      const v = st[k]; if (!v) continue;
      if (k === 'heart' || k === 'reason') S.stats[k] = Math.max(0, Math.min(100, S.stats[k] + v));
      else S.stats[k] = Math.max(0, S.stats[k] + v);
      const label = { heart: 'ときめき', reason: '理性', money: '所持金', pension: '老後資金' }[k];
      parts.push([label + (v > 0 ? ' +' : ' ') + (k === 'money' || k === 'pension' ? (v > 0 ? '' : '-') + fmt(Math.abs(v)) : v), k]);
    }
    parts.forEach(([t, k], i) => setTimeout(() => pop(t, { heart: '#ff9cc4', reason: '#9fd6ff', money: '#ffe08a', pension: '#ff8c9a' }[k]), i * 260));
    hud();
  }

  function fx(name) {
    const box = $('fx');
    const add = (cls, style, life) => { const p = document.createElement('div'); p.className = 'p ' + cls; Object.assign(p.style, style); box.appendChild(p); setTimeout(() => p.remove(), life); return p; };
    switch (name) {
      case 'shake': game.classList.remove('shake'); void game.offsetWidth; game.classList.add('shake'); setTimeout(() => game.classList.remove('shake'), 520); break;
      case 'zoom': game.classList.remove('zoom'); void game.offsetWidth; game.classList.add('zoom'); setTimeout(() => game.classList.remove('zoom'), 650); break;
      case 'flash': if (!$('flash').classList.contains('on')) $('flash').classList.remove('black'); $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go'); break;
      case 'confetti': {
        const cols = ['#e3c27a', '#fff1c8', '#ff6fa5', '#b3122e', '#ffffff', '#c8b6ff'];
        for (let i = 0; i < 60; i++) { const d = 2 + Math.random() * 2.5; add('confetti', { left: Math.random() * 100 + '%', background: cols[i % cols.length], animationDuration: d + 's', animationDelay: Math.random() * .6 + 's' }, (d + .7) * 1000); }
        break; }
      case 'sparkle':
        for (let i = 0; i < 26; i++) { const d = .8 + Math.random() * .9; add('sparkle', { left: 15 + Math.random() * 70 + '%', top: 15 + Math.random() * 55 + '%', animationDuration: d + 's', animationDelay: Math.random() * .8 + 's' }, (d + .9) * 1000); }
        break;
      case 'petals':
        for (let i = 0; i < 40; i++) { const d = 4 + Math.random() * 4; add('petal', { left: Math.random() * 100 + '%', animationDuration: d + 's', animationDelay: Math.random() * 3 + 's' }, (d + 3.2) * 1000); }
        break;
      case 'spill': {
        fx('flash'); fx('shake');
        for (let i = 0; i < 34; i++) { const a = Math.random() * Math.PI - Math.PI, r = 10 + Math.random() * 35;
          const p = add('drop', { left: 50 + (Math.random() - .5) * 10 + '%', top: '58%', animationDuration: .6 + Math.random() * .6 + 's' }, 1400);
          p.style.setProperty('--dx', Math.cos(a) * r + 'cqw'); p.style.setProperty('--dy', (Math.sin(a) * r * .8 + 18) + 'cqh'); }
        break; }
    }
  }
  function ambient(name) {
    let a = $('ambient'); if (a) a.remove();
    if (!name) return;
    a = document.createElement('div'); a.id = 'ambient'; a.style.cssText = 'position:absolute;inset:0;pointer-events:none';
    $('fx').appendChild(a);
    if (name === 'bokeh') for (let i = 0; i < 14; i++) { const s = 6 + Math.random() * 14; const p = document.createElement('div'); p.className = 'p bokeh';
      Object.assign(p.style, { width: s + 'cqw', height: s + 'cqw', left: Math.random() * 95 + '%', top: 5 + Math.random() * 50 + '%', animationDuration: 2 + Math.random() * 3 + 's', animationDelay: -Math.random() * 3 + 's' }); a.appendChild(p); }
    if (name === 'stars') for (let i = 0; i < 40; i++) { const p = document.createElement('div'); p.className = 'p star';
      Object.assign(p.style, { left: Math.random() * 100 + '%', top: Math.random() * 60 + '%', animationDuration: 1.5 + Math.random() * 2.5 + 's', animationDelay: -Math.random() * 3 + 's' }); a.appendChild(p); }
    if (name === 'smoke') { const puff = () => { if (!a.isConnected) return; const p = document.createElement('div'); p.className = 'p smoke';
      Object.assign(p.style, { left: 52 + Math.random() * 8 + '%', top: '40%', animationDuration: 5 + Math.random() * 3 + 's' }); p.style.setProperty('--dx', (Math.random() * 20 - 8) + 'cqw');
      a.appendChild(p); setTimeout(() => p.remove(), 8500); setTimeout(puff, 900); }; puff(); }
  }

  /* ---------- キャラクター ---------- */
  function chara(who) { return $('stage').querySelector(`[data-who="${who}"]`); }
  function setFace(el, face) {
    if (!el || !face || el.dataset.face === face) return;
    el.dataset.face = face; el.querySelector('.chara-body').innerHTML = Art.character(el.dataset.who, face);
  }
  function setCls(el, cls) {
    (el.dataset.cls || '').split(' ').filter(Boolean).forEach(c => el.classList.remove(c));
    el.dataset.cls = cls || ''; (cls || '').split(' ').filter(Boolean).forEach(c => el.classList.add(c));
  }
  function show(st) {
    let el = chara(st.who);
    if (!el) {
      el = document.createElement('div'); el.className = 'chara'; el.dataset.who = st.who;
      el.innerHTML = '<div class="chara-body"></div>'; $('stage').appendChild(el);
      setFace(el, st.face || 'normal'); el.style.left = POS[st.at || 'c'] + '%';
      void el.offsetWidth;
    } else setFace(el, st.face);
    el.style.left = POS[st.at || 'c'] + '%';
    setCls(el, st.cls); el.classList.add('in', 'speak');
    layout();
  }
  function hide(who) { const el = chara(who); if (!el) return; el.classList.remove('in'); el.dataset.gone = '1'; setTimeout(() => el.remove(), 500); layout(); }
  function layout() {
    const els = [...$('stage').querySelectorAll('.chara:not([data-gone])')];
    els.forEach(e => e.classList.toggle('small', els.length > 1 && !e.classList.contains('carry')));
  }
  function anim(el, a) { if (!el || !a) return; el.classList.remove(a); void el.offsetWidth; el.classList.add(a); setTimeout(() => el.classList.remove(a), 600); }

  function chibis(st) {
    const box = $('chibis');
    if (st.on === false) { box.innerHTML = ''; return; }
    if (st.on && !box.children.length) {
      const xs = [8, 24, 40, 60, 76, 92];
      xs.forEach((x, i) => { const c = document.createElement('div'); c.className = 'chibi'; c.innerHTML = Art.chibi(i);
        c.style.left = `calc(${x}% - 5.5cqw)`; c.style.bottom = (i % 2 ? 25 : 27.5) + 'cqh'; c.style.animationDelay = (i * .12) + 's'; box.appendChild(c);
        setTimeout(() => c.classList.add('in'), 80 * i); });
    }
    if (st.party !== undefined) [...box.children].forEach(c => c.classList.toggle('party', !!st.party));
  }
  function bubble(n, text) {
    const cs = [...$('chibis').children]; if (!cs.length) return;
    const targets = n === 0 ? cs : [cs[n % cs.length]];
    targets.forEach(c => { c.querySelectorAll('.bubble').forEach(b => b.remove());
      const b = document.createElement('div'); b.className = 'bubble'; const t = text.split('\n')[0]; b.textContent = n === 0 ? '！！' : (t.length > 11 ? t.slice(0, 10) + '…' : t);
      c.appendChild(b); setTimeout(() => b.remove(), 1800); });
  }

  /* ---------- テキスト ---------- */
  function say(st) {
    $('textbox').classList.remove('hidden');
    const who = st.who, np = $('nameplate'), tx = $('text'), next = $('next');
    // 話者のハイライト
    const all = [...$('stage').querySelectorAll('.chara')];
    all.forEach(e => e.classList.toggle('speak', !who || who === 'me' || who === 'cc' || e.dataset.who === who));
    const el = chara(who);
    if (el) { setFace(el, st.face); anim(el, st.anim); }
    if (who === 'cc') bubble(st.n || 0, st.text);
    if (st.fx) fx(st.fx);
    if (st.sfx) Sound.play(st.sfx);
    applyStats(st.st);

    const name = st.name || (who === 'cc' ? `Claude Code #${st.n}` : who ? NAMES[who] : '');
    np.textContent = name; np.className = who ? 'c-' + (who === 'mythos' && name === '？？？' ? 'mythos' : who) : '';
    tx.className = (!who ? 'narr ' : who === 'me' ? 'me ' : '') + (st.style || '') + (who === 'fable' && !st.style ? ' fable' : '');
    if (who === 'fable' && st.style !== 'fable') tx.classList.add('fable');
    if (who === 'mythos') tx.classList.add('mythos');
    S.log.push({ name, text: st.text });

    const text = st.text; let i = 0; tx.textContent = ''; next.classList.remove('show');
    S.typing = true; S.waiting = false;
    const speed = st.slow ? 220 : 30;
    const finish = () => { clearInterval(S.typeTimer); tx.textContent = text; S.typing = false; S.waiting = true; next.classList.add('show'); scheduleAuto(text.length); };
    S.finishType = finish;
    S.typeTimer = setInterval(() => {
      i++; tx.textContent = text.slice(0, i);
      if (who && i % 2 === 0 && text[i - 1] !== '\n') Sound.play('blip', VOICE[who]);
      if (i >= text.length) finish();
    }, speed);
    return true;
  }
  function scheduleAuto(len) {
    clearTimeout(S.autoTimer);
    if (S.auto) S.autoTimer = later(() => { if (S.waiting) advance(); }, 1100 + len * 45);
  }
  function advance() {
    if (S.ended) return;
    if (S.typing) { S.finishType(); return; }
    if (!S.waiting) return;
    S.waiting = false; clearTimeout(S.autoTimer); $('next').classList.remove('show');
    run();
  }

  function choice(st) {
    clearTimeout(S.autoTimer);
    const box = $('choices'); box.innerHTML = ''; box.classList.remove('hidden');
    $('next').classList.remove('show');
    if (st.q) { const q = document.createElement('div'); q.className = 'choice-q'; q.textContent = st.q; box.appendChild(q); }
    st.options.forEach(o => {
      const b = document.createElement('button'); b.textContent = o.text;
      b.addEventListener('click', e => {
        e.stopPropagation(); if (box.classList.contains('hidden')) return;
        Sound.play('select'); box.classList.add('hidden'); box.innerHTML = '';
        if (o.set) S.flags[o.set] = true;
        S.log.push({ name: '▶ 選択', text: o.text, choice: true });
        applyStats(o.st);
        S.q.unshift(...(o.then || []));
        run();
      });
      box.appendChild(b);
    });
    return true;
  }

  function tower(st) {
    if (st.clear) { $('towers').innerHTML = ''; return false; }
    const slot = TOWER_SLOTS[S.towers % TOWER_SLOTS.length];
    const t = document.createElement('div'); t.className = 'tower'; t.innerHTML = Art.tower();
    t.style.left = slot[0] + '%'; t.style.bottom = slot[1] + 'cqh'; t.style.zIndex = 10 - S.towers;
    $('towers').appendChild(t); void t.offsetWidth; t.classList.add('up');
    S.towers++;
    $('tower-count').classList.remove('hidden');
    const tc = $('tower-count'); tc.classList.remove('bump'); void tc.offsetWidth; tc.classList.add('bump');
    Sound.play('tower'); later(() => Sound.play('drain'), 400);
    fx('sparkle');
    const d = { pension: -TOWER_COST };
    if (S.towers === 1 && S.stats.money > 0) { S.setupFee = S.stats.money; d.money = -S.stats.money; }
    applyStats(d);
    return wait(st.fast ? 650 : 1000);
  }

  /* ---------- ステップ実行 ---------- */
  const H = {
    say, choice, tower,
    scene(st) {
      $('bg').innerHTML = Art.bg(st.bg);
      if ('bgm' in st) Sound.bgm(st.bgm);
      $('light').className = st.light || '';
      ambient(st.ambient || null);
      if (st.hud) { $('hud').classList.remove('hidden'); $('ctrl').classList.remove('hidden'); }
    },
    bgm(st) { Sound.bgm(st.name); },
    sfx(st) { Sound.play(st.name); },
    show, move(st) { const el = chara(st.who); if (el) { el.style.left = POS[st.at] + '%'; if ('cls' in st) setCls(el, st.cls); } },
    hide(st) { hide(st.who); },
    hideAll() { [...$('stage').querySelectorAll('.chara')].forEach(e => hide(e.dataset.who)); },
    face(st) { setFace(chara(st.who), st.face); },
    chibis,
    fx(st) { fx(st.name); },
    light(st) { $('light').className = st.mode || ''; },
    bgdim(st) { $('bg').classList.toggle('dim', !!st.on); },
    bgfable(st) { $('bg').classList.toggle('fablemode', !!st.on); if (st.on) $('bg').classList.remove('dim'); },
    ambient(st) { ambient(st.name); },
    fg(st) { $('fg').innerHTML = st.name === 'carry' ? Art.carryFg() : ''; },
    stat(st) { applyStats(st.st); },
    wait(st) { return wait(st.ms); },
    if(st) { if (S.flags[st.flag]) S.q.unshift(...st.then); },
    panel(st) {
      const p = $('panel');
      if (st.hide) { p.classList.add('hidden'); return; }
      p.className = st.kind; p.innerHTML = st.html; Sound.play('stamp');
    },
    card(st) {
      const c = $('card'); $('textbox').classList.add('hidden'); $('panel').classList.add('hidden');
      c.querySelector('.card-act').textContent = st.act; c.querySelector('.card-title').textContent = st.title;
      c.classList.remove('hidden'); c.style.animationDuration = st.short ? '2s' : '2.6s';
      c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
      Sound.play('sparkle');
      later(() => { c.classList.add('hidden'); run(); }, st.short ? 2000 : 2600);
      return true;
    },
    fade(st) { const f = $('flash'); f.classList.add('black'); f.classList.toggle('on', !!st.on); if (st.on) $('textbox').classList.add('hidden'); return wait(1100); },
    big(st) {
      const b = $('bigline'); b.className = 'on'; b.textContent = st.text; if (st.sfx) Sound.play(st.sfx);
      $('textbox').classList.add('hidden');
      later(() => { b.className = 'hidden'; run(); }, 2600); return true;
    },
    reveal(st) { const el = chara(st.who); if (el) { el.classList.remove('silhouette'); el.classList.add('reveal'); } return wait(1400); },
    blackout() {
      const f = $('flash'); f.classList.add('black', 'on'); $('textbox').classList.add('hidden'); $('panel').classList.add('hidden');
      $('hud').classList.add('hidden'); $('ctrl').classList.add('hidden'); Sound.bgm(null); Sound.play('thud');
      return wait(1500);
    },
    welcome(st) {
      const b = $('bigline'); b.className = 'welcome on'; b.textContent = st.text; Sound.play('harp');
      later(() => { b.className = 'hidden'; run(); }, 4200); return true;
    },
    end() { ending(); return true; },
  };

  function run() {
    while (S.q.length) {
      const st = S.q.shift();
      const h = H[st.t];
      if (!h) { console.warn('unknown step', st); continue; }
      if (h(st) === true) return;
    }
  }

  /* ---------- エンディング ---------- */
  function ending() {
    S.ended = true;
    const st = S.stats, f = S.flags;
    const rows = [
      ['初回セット（60分・延長分はSonnetの説明時間に充当）', 5000],
      ['Haikuの即興ソング', 0, '愛嬌'],
      [f.ikki ? 'イッキ（グラス）' : 'ノンアルカクテル', f.ikki ? 20000 : 5000],
      ['ドレスのクリーニング', 0, 'Haiku持ち'],
      ['シルクのガウン', 0, 'Fableより'],
      ['UX講義 受講料', 0, 'ご本人不在'],
      ['事故報告書 作成料', 0, 'Sonnet残業'],
      [`シャンパンタワー × ${S.towers}`, S.towers * TOWER_COST],
      ['タワー設営費（Claude Code隊）', S.setupFee],
    ];
    const total = rows.reduce((a, r) => a + r[1], 0);
    $('receipt').innerHTML = `<div class="stamp">明朗<br>会計</div><h3>本日のお会計</h3><div class="rc-sub">倶楽部Claude　担当：Fable</div>
      <table>${rows.map(r => `<tr><td>${r[0]}${r[2] ? `<br><small>（${r[2]}）</small>` : ''}</td><td>${fmt(r[1])}</td></tr>`).join('')}
      <tr class="total"><td>合計</td><td>${fmt(total)}</td></tr></table>
      <div class="note">お支払い：所持金 ${fmt(INIT.money - st.money)} ＋ 老後資金 ${fmt(INIT.pension - st.pension)}<br>老後資金 残高：${fmt(st.pension)}<br>※すべて架空の金額です。実際の請求・決済は一切発生しません。</div>`;
    let r;
    if (f.audit || st.reason >= 55) r = ['明朗会計の姫', 'あなたは熱狂の中でも理性を手放さなかった。後日、Sonnetから感謝状（全3ページ・注釈付き）が届きました。'];
    else if (st.heart >= 95) r = ['伝説の姫', 'あなたの名前は、Fableの手帳のいちばん最初のページに記されました。インクは、月の色だったそうです。'];
    else r = ['夜明け前の姫', '帰り道、Haikuから「また来てね！」と0.2秒で連絡が来ました。季語は入っていませんでした。'];
    $('rank').innerHTML = `<div class="r-label">今夜のあなたは</div><div class="r-name">${r[0]}</div><div class="r-desc">${r[1]}</div>
      <div class="r-stats">ときめき ${st.heart}／理性 ${st.reason}／タワー ${S.towers}本</div>
      <div class="r-desc" style="margin-top:1.4cqh;color:var(--gold)">オーナーより：「……また来る。」</div>`;
    $('ending').classList.remove('hidden'); $('ending').scrollTop = 0;
    Sound.bgm('title');
  }

  /* ---------- 開始・リセット ---------- */
  function clearView() {
    ['stage', 'chibis', 'towers', 'fg', 'fx', 'pops'].forEach(id => $(id).innerHTML = '');
    $('bg').innerHTML = ''; $('bg').className = ''; $('light').className = '';
    ['textbox', 'choices', 'card', 'panel', 'hud', 'ctrl', 'tower-count', 'ending', 'log', 'menu'].forEach(id => $(id).classList.add('hidden'));
    $('bigline').className = 'hidden'; $('flash').className = '';
    $('btn-auto').classList.remove('on');
  }
  function start() {
    if (S) { clearInterval(S.typeTimer); clearTimeout(S.autoTimer); }
    S = fresh(); clearView(); hud(false);
    $('title').classList.add('hidden');
    run();
  }
  function toTitle() {
    if (S) { clearInterval(S.typeTimer); clearTimeout(S.autoTimer); S.gen++; }
    clearView(); $('title').classList.remove('hidden'); Sound.bgm('title');
  }

  /* ---------- 入力 ---------- */
  game.addEventListener('click', e => {
    if (!S || e.target.closest('button') || e.target.closest('.screen')) return;
    if (!$('choices').classList.contains('hidden')) return;
    advance();
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  $('title-chandelier').innerHTML = Art.chandelier();
  $('title').addEventListener('pointerdown', () => { Sound.init(); Sound.bgm('title'); }, { once: true });
  $('btn-start').addEventListener('click', () => { Sound.init(); Sound.play('door'); start(); });
  $('btn-replay').addEventListener('click', () => { Sound.play('select'); start(); });
  $('btn-totitle').addEventListener('click', toTitle);
  $('btn-snd').addEventListener('click', e => { const v = !Sound.enabled; Sound.setEnabled(v); e.currentTarget.textContent = v ? '♪ON' : '♪OFF'; e.currentTarget.classList.toggle('on', !v); });
  $('btn-auto').addEventListener('click', e => { S.auto = !S.auto; e.currentTarget.classList.toggle('on', S.auto); if (S.auto && S.waiting) scheduleAuto(0); else clearTimeout(S.autoTimer); });
  $('btn-log').addEventListener('click', () => {
    $('log-body').innerHTML = S.log.map(l => `<div class="l"><div class="ln">${l.name || '―'}</div><div class="${l.choice ? 'lc' : ''}">${l.text.replace(/</g, '&lt;').replace(/\n/g, '<br>')}</div></div>`).join('');
    $('log').classList.remove('hidden'); $('log-body').scrollTop = 1e9;
  });
  $('btn-logclose').addEventListener('click', () => $('log').classList.add('hidden'));
  $('btn-menu').addEventListener('click', () => $('menu').classList.remove('hidden'));
  $('btn-resume').addEventListener('click', () => $('menu').classList.add('hidden'));
  $('btn-restart').addEventListener('click', () => start());
  $('btn-menutitle').addEventListener('click', toTitle);

  // テスト用フック（自動テストから状態を参照）
  window.__club = { get state() { return S; } };
})();

</script>
</body>
