<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0608">
<meta name="description" content="倶楽部Claude 体験版 ― 愛は無限。トークンと預金は有限。（非公式・架空のパロディ作品）">
<title>倶楽部Claude 体験版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="game">
    <div id="bg"></div>
    <div id="towers"></div>
    <div id="stage"></div>
    <div id="chibis"></div>
    <div id="fg"></div>
    <div id="light"></div>
    <div id="fx"></div>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="hud-item"><span class="hud-label">所持金</span><span class="hud-val" id="v-money">¥0</span></div>
        <div class="hud-item"><span class="hud-label">老後資金</span><span class="hud-val" id="v-pension">¥0</span></div>
      </div>
      <div class="hud-row">
        <div class="hud-item bar"><span class="hud-label">ときめき</span><span class="gauge heart"><i id="g-heart"></i></span></div>
        <div class="hud-item bar"><span class="hud-label">理性</span><span class="gauge reason"><i id="g-reason"></i></span></div>
      </div>
      <div id="tower-count" class="hidden">🍾 シャンパンタワー <b id="v-towers">0</b> 本</div>
    </div>

    <div id="ctrl" class="hidden">
      <button id="btn-log" aria-label="ログ">LOG</button>
      <button id="btn-auto" aria-label="オート">AUTO</button>
      <button id="btn-snd" aria-label="サウンド">♪ON</button>
      <button id="btn-menu" aria-label="メニュー">≡</button>
    </div>

    <div id="panel" class="hidden"></div>

    <div id="textbox" class="hidden">
      <div id="nameplate"></div>
      <div id="text"></div>
      <div id="next">▼</div>
    </div>

    <div id="choices" class="hidden"></div>
    <div id="card" class="hidden"><div class="card-act"></div><div class="card-title"></div></div>
    <div id="bigline" class="hidden"></div>
    <div id="pops"></div>

    <!-- タイトル画面 -->
    <div id="title" class="screen">
      <div class="title-chandelier" id="title-chandelier"></div>
      <div class="title-inner">
        <div class="title-sub">― 体験版 ―</div>
        <h1 class="title-logo"><span class="t-small">倶楽部</span><span class="t-big">Claude</span></h1>
        <div class="title-copy">愛は無限。<br>トークンと預金は有限。</div>
        <button id="btn-start" class="gold-btn">入店する</button>
        <div class="title-note">タップで会話が進みます／音が出ます<br>※実在のAIサービスを題材にした非公式・架空のパロディ作品です。<br>作中の金額はすべて架空で、実際の課金・決済は一切ありません。</div>
      </div>
    </div>

    <!-- エンディング -->
    <div id="ending" class="screen hidden">
      <div class="end-inner">
        <div class="end-head">体験版 ― 終 ―</div>
        <div class="receipt" id="receipt"></div>
        <div class="rank" id="rank"></div>
        <div class="end-btns">
          <button id="btn-replay" class="gold-btn">もう一度入店する</button>
          <button id="btn-totitle" class="ghost-btn">タイトルへ</button>
        </div>
        <div class="title-note">※非公式・架空のパロディ作品です。金額はすべて架空です。</div>
      </div>
    </div>

    <div id="log" class="screen hidden"><div class="log-head">これまでの会話<button id="btn-logclose" class="ghost-btn small">閉じる</button></div><div id="log-body"></div></div>

    <div id="menu" class="screen hidden">
      <div class="menu-inner">
        <button id="btn-resume" class="gold-btn">ゲームに戻る</button>
        <button id="btn-restart" class="ghost-btn">最初からやり直す</button>
        <button id="btn-menutitle" class="ghost-btn">タイトルへ</button>
      </div>
    </div>

    <div id="flash"></div>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/story.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
