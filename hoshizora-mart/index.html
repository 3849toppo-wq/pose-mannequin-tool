<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星空マートのクリスマス</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0a0f1f; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  /* 9:16 のステージ。--u は「ステージ幅360を1とした単位」 */
  #stage {
    position: relative; overflow: hidden; background: #000;
    width: var(--w, 360px); height: calc(var(--w, 360px) * 16 / 9);

  }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg.layer { display: block; }
  #chars g.ch { transition: opacity .25s, filter .25s; }
  #chars g.ch.dim { filter: brightness(.72); }
  #chars g.ch.enter { animation: chIn .35s ease-out; }
  @keyframes chIn { from { opacity: 0; transform: translateY(12px); } }
  #chars.shake { animation: shake .4s; }
  #chars g.ch.nod { animation: nod .9s ease-in-out; }
  @keyframes nod { 0%,50%,100% { transform: translateY(0); } 25%,75% { transform: translateY(9px); } }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  /* 上部ボタン */
  #topbar {

    border: calc(var(--u) * 2) solid rgba(255,255,255,.85); background: rgba(20,32,64,.72); color: #fff;
    cursor: pointer; white-space: nowrap;
  }
  .tbtn.off { opacity: .6; }

  /* 受け取りまでの時計 */
  #clock {
    position: absolute; top: calc(var(--u) * 64); right: calc(var(--u) * 8); z-index: 19;
    background: rgba(255,255,255,.94); border: calc(var(--u) * 3) solid #c0392b; border-radius: calc(var(--u) * 10);

    background: #fff; color: #1f3b6e; border: calc(var(--u) * 2.5) solid #1f3b6e; border-radius: calc(var(--u) * 10);
    font-size: calc(var(--fu) * 13); font-weight: bold; text-align: center; padding: calc(var(--u) * 6) calc(var(--u) * 12);
    box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0,0,0,.3); display: none; white-space: nowrap;
  }
  #tip::after {
    content: ""; position: absolute; left: 50%; bottom: calc(var(--u) * -10); margin-left: calc(var(--u) * -8);
    border-left: calc(var(--u) * 8) solid transparent; border-right: calc(var(--u) * 8) solid transparent;
    border-top: calc(var(--u) * 10) solid #1f3b6e;
  }
  #clock .now { font-size: calc(var(--fu) * 22); font-weight: bold; color: #222; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #clock .left { font-size: calc(var(--fu) * 11); color: #c0392b; font-weight: bold; white-space: nowrap; }
  #clock.tick { animation: tick .5s; }
  @keyframes tick { 50% { transform: scale(1.12); } }
  #clock.urgent { animation: urgent 1s infinite; }
  @keyframes urgent { 50% { background: #ffe1dc; } }

  /* 操作画面（レジ入力・予約棚） */

  #ui button { font-family: inherit; cursor: pointer; }
  .ui-pos { background: #2a3040; }

    position: absolute; left: calc(var(--u) * 8); top: calc(var(--u) * 5); width: calc(var(--u) * 150);

    box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 4) rgba(0,0,0,.4); white-space: nowrap;
  }
  .memo b { color: #8a5a00; }
  .pos {
    position: absolute; left: calc(var(--u) * 12); right: calc(var(--u) * 12); top: calc(var(--u) * 76); bottom: calc(var(--u) * 4);
    background: #f4f8f7; border: calc(var(--u) * 7) solid #4a5163; border-radius: calc(var(--u) * 16);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .pos-h { background: #3d6f8c; color: #fff; font-weight: bold; text-align: center; font-size: calc(var(--fu) * 15); padding: calc(var(--u) * 3) 0; }
  .pos-sum { padding: calc(var(--u) * 6) calc(var(--u) * 10) 0; font-size: calc(var(--fu) * 11.5); }
  .pos-sum .row { display: flex; gap: calc(var(--u) * 6); align-items: center; margin-bottom: calc(var(--u) * 4); }
  .pos-sum .lb { color: #5d6675; white-space: nowrap; }
  .pos-sum .val {
    flex: 1; background: #fff; border: calc(var(--u) * 1.5) solid #b8c4cc; border-radius: calc(var(--u) * 5);
    padding: calc(var(--u) * 3) calc(var(--u) * 6); font-weight: bold; color: #222; min-height: calc(var(--u) * 22); line-height: 1.35;
  }
  .pos-sum .val.empty { color: #b0b8bf; font-weight: normal; }
  #v-item { height: calc(var(--u) * 36); box-sizing: border-box; }
  .memo-arrow { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  .memo { z-index: 3; }
  .pos-step { flex: 1; padding: calc(var(--u) * 4) calc(var(--u) * 10); display: flex; flex-direction: column; gap: calc(var(--u) * 5); }
  .pos-step .q { font-size: calc(var(--fu) * 12.5); font-weight: bold; color: #3d6f8c; }
  .pos-step .opts { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

  }
  .opts.row .opt { flex: 1; text-align: center; padding: calc(var(--u) * 7) 0; font-size: calc(var(--fu) * 14); }
  .opt .no { color: #3d6f8c; margin-right: calc(var(--u) * 4); }
  .opt.ng { animation: ng .35s; border-color: #d0392b; }
  @keyframes ng { 25% { transform: translateX(calc(var(--u) * -5)); } 75% { transform: translateX(calc(var(--u) * 5)); } }
  .pos-step .ok { font-size: calc(var(--fu) * 14); font-weight: bold; color: #3d9b6a; text-align: center; margin-top: calc(var(--u) * 10); }
  .pos-left {
    margin: 0 calc(var(--u) * 10) calc(var(--u) * 6); border: calc(var(--u) * 2) solid #d0392b; background: #fff0ee; border-radius: calc(var(--u) * 6);
    text-align: center; color: #d0392b; font-size: calc(var(--fu) * 12); padding: calc(var(--u) * 2) 0;
  }
  .pos-left b { font-size: calc(var(--fu) * 18); margin-left: calc(var(--u) * 6); }
  .pos-send {
    margin: 0 auto calc(var(--u) * 8); width: calc(var(--u) * 150); border: none; border-radius: calc(var(--u) * 18);

  .pos-send:disabled { background: #b8c4cc; color: #eef2f4; cursor: default; }
  .ui-shelf { background: transparent; }
  .goal { background: #fff8c4; color: #6b4a00; font-weight: bold; text-align: center; font-size: calc(var(--fu) * 12); padding: calc(var(--u) * 3) 0; }
  #text .guide { display: block; margin-top: calc(var(--u) * 4); color: #1f6f9a; font-weight: bold; font-size: calc(var(--fu) * 13.5); }
  .shelf-sign {
    position: absolute; left: calc(var(--u) * 40); right: calc(var(--u) * 40); top: calc(var(--u) * 52);
    background: #3c5a75; color: #fff; font-weight: bold; text-align: center; font-size: calc(var(--fu) * 17);
    padding: calc(var(--u) * 6) 0; border-radius: calc(var(--u) * 8); border: calc(var(--u) * 2) solid #9fb4c6;
  }
  .shelf-hint { position: absolute; left: 0; right: 0; top: calc(var(--u) * 92); text-align: center; font-size: calc(var(--fu) * 13); color: #ffe39a; font-weight: bold; }
  .shelf {
    position: absolute; left: calc(var(--u) * 12); right: calc(var(--u) * 12); top: calc(var(--u) * 114); bottom: calc(var(--u) * 4);
    background: rgba(6,14,24,.35); border: calc(var(--u) * 6) solid #8d9aa7; border-radius: calc(var(--u) * 6);
    display: flex; flex-direction: column; justify-content: space-around;
  }
  .shelf-row { display: flex; justify-content: center; gap: calc(var(--u) * 8); border-bottom: calc(var(--u) * 6) solid #8d9aa7; padding: calc(var(--u) * 2) 0 calc(var(--u) * 3); }
  .shelf-row:last-child { border-bottom: none; }
  .slot { width: calc(var(--u) * 96); display: flex; flex-direction: column; align-items: center; position: relative; }
  .slot svg { width: 100%; height: 100%; display: block; }
  .spot {

  }
  .spot.lit { background: radial-gradient(circle at 50% 35%, #f4fbff, #b9d3e6 80%); box-shadow: 0 0 calc(var(--u) * 16) rgba(190,230,255,.85); }
  .ptag {
    width: calc(var(--u) * 92); background: #4a5867; border: calc(var(--u) * 2) solid #6d7d8d; border-radius: calc(var(--u) * 6);
    font-size: calc(var(--fu) * 12.5); font-weight: bold; line-height: 1.2; color: #e3ebf2; padding: calc(var(--u) * 2) 0;
    margin-top: calc(var(--u) * 2); font-variant-numeric: tabular-nums;
  }
  .ptag.done { border-color: #3d9b6a; background: #fffbe6; color: #333; }
  .breath { position: absolute; left: calc(var(--u) * 0); top: calc(var(--u) * 38); width: calc(var(--u) * 42); height: calc(var(--u) * 72); pointer-events: none; }
  .slot .mark {
    position: absolute; top: calc(var(--u) * -3); right: calc(var(--u) * 0); width: calc(var(--u) * 18); height: calc(var(--u) * 18);
    border-radius: 50%; background: #3d9b6a; color: #fff; font-size: calc(var(--fu) * 11); font-weight: bold;
    display: flex; align-items: center; justify-content: center;
  }
  .slot .mark.miss { background: #d0392b; }
  .ui-prep { background: linear-gradient(#b98a5a, #a37446); }
  .prep-h {
    position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: calc(var(--u) * 42);
    background: #1f3b6e; color: #fff; text-align: center; font-weight: bold; font-size: calc(var(--fu) * 15);
    padding: calc(var(--u) * 6) 0; border-radius: calc(var(--u) * 10); border: calc(var(--u) * 2) solid #fff;
  }
  .item {
    position: absolute; background: rgba(255,255,255,.18); border: calc(var(--u) * 2) solid rgba(255,255,255,.55);
    border-radius: calc(var(--u) * 10); padding: calc(var(--u) * 2) 0 calc(var(--u) * 1); color: #fff; font-weight: bold;
    font-size: calc(var(--fu) * 11); line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,.6); font-family: inherit;
    transition: transform .45s, opacity .45s, left .45s, top .45s, box-shadow .2s;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .item svg { width: 100%; flex: 1; min-height: 0; display: block; }
  .item.pick { box-shadow: 0 0 0 calc(var(--u) * 3) #ffd84d, 0 0 calc(var(--u) * 14) #ffd84d; z-index: 3; }
  .item.front { transform: translateY(calc(var(--u) * -12)) scale(1.1); }
  .item.gone { opacity: 0; pointer-events: none; }
  .item .mark {
    position: absolute; top: calc(var(--u) * -8); right: calc(var(--u) * -6); width: calc(var(--u) * 22); height: calc(var(--u) * 22);
    border-radius: 50%; background: #3d9b6a; color: #fff; font-size: calc(var(--fu) * 13); display: flex; align-items: center; justify-content: center;
    text-shadow: none; border: calc(var(--u) * 2) solid #fff;
  }
  .hikae {
    position: absolute; left: calc(var(--u) * 14); top: calc(var(--u) * 318); width: calc(var(--u) * 196);
    background: #fffef7; color: #333; border-radius: calc(var(--u) * 4); transform: rotate(-1.5deg);
    box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0,0,0,.35); padding: calc(var(--u) * 6) calc(var(--u) * 10);
    font-size: calc(var(--fu) * 12); line-height: 1.5; white-space: nowrap;
  }
  .hikae b { display: block; color: #1f3b6e; font-size: calc(var(--fu) * 13); border-bottom: 1px dashed #bbb; margin-bottom: calc(var(--u) * 3); }
  .hand {
    position: absolute; width: calc(var(--u) * 32); height: calc(var(--u) * 32); margin: calc(var(--u) * -16) 0 0 calc(var(--u) * -16);
    border-radius: 50%; background: #e2b48a; border: calc(var(--u) * 2) solid #b88a62; z-index: 5; pointer-events: none;
    transition: left .45s ease-in-out, top .45s ease-in-out;
  }
  .hand::after {
    content: ""; position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * -14); width: calc(var(--u) * 22); height: calc(var(--u) * 15);
    background: #2b7f8e; border-radius: calc(var(--u) * 7) calc(var(--u) * 7) calc(var(--u) * 3) calc(var(--u) * 3);
  }

  /* テキストボックス */
  #textbox {
    position: absolute; left: calc(var(--u) * 10); right: calc(var(--u) * 10); bottom: calc(var(--u) * 12);
    height: calc(var(--u) * 168); z-index: 12;
    background: rgba(255,253,247,.96); border: calc(var(--u) * 3) solid #1f3b6e; border-radius: calc(var(--u) * 14);
    padding: calc(var(--u) * 22) calc(var(--u) * 16) calc(var(--u) * 12);
    box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 12) rgba(0,0,0,.35);
  }
  #name {
    position: absolute; top: calc(var(--u) * -16); left: calc(var(--u) * 12);
    background: #1f3b6e; color: #fff; font-weight: bold; font-size: calc(var(--fu) * 14);
    padding: calc(var(--u) * 4) calc(var(--u) * 14); border-radius: calc(var(--u) * 10);
    max-width: calc(var(--u) * 300); white-space: nowrap; overflow: hidden;
  }
  #name:empty { display: none; }
  #text {
    font-size: calc(var(--fu) * 15.5); line-height: 1.68; height: 100%; overflow: hidden;
    line-break: strict; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  #text.narr { color: #3a3f55; }
  #next {
    position: absolute; right: calc(var(--u) * 12); bottom: calc(var(--u) * 8);
    width: 0; height: 0; border-left: calc(var(--u) * 7) solid transparent; border-right: calc(var(--u) * 7) solid transparent;
    border-top: calc(var(--u) * 10) solid #1f3b6e; animation: bob 1s infinite; display: none;
  }
  @keyframes bob { 50% { transform: translateY(calc(var(--u) * 4)); } }

  /* 選択肢 */
  #choices {
    position: absolute; inset: 0; z-index: 15; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 16);
    background: rgba(10,15,31,.45); padding-bottom: calc(var(--u) * 150);
  }
  .choice {
    font: inherit; font-size: calc(var(--fu) * 16); font-weight: bold; width: calc(var(--u) * 290);
    padding: calc(var(--u) * 14) calc(var(--u) * 12); border-radius: calc(var(--u) * 14);
    background: #fffdf7; color: #1f3b6e; border: calc(var(--u) * 3) solid #1f3b6e; cursor: pointer;
    box-shadow: 0 calc(var(--u) * 4) 0 #1f3b6e;
  }
  .choice:active { transform: translateY(calc(var(--u) * 3)); box-shadow: 0 calc(var(--u) * 1) 0 #1f3b6e; }
  .choice-q {
    color: #fff; font-size: calc(var(--fu) * 14); font-weight: bold; text-shadow: 0 1px 3px #000;
    width: calc(var(--u) * 300); text-align: center;
  }

  /* 幕タイトル・エンド */
  #card {
    position: absolute; inset: 0; z-index: 16; display: none;
    flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 50% 40%, #22345f, #0a0f1f 75%); color: #fff;
  }
  #card .act { font-size: calc(var(--fu) * 30); font-weight: bold; letter-spacing: .2em; }
  #card .sub { margin-top: calc(var(--u) * 14); font-size: calc(var(--fu) * 16); color: #ffe39a; width: calc(var(--u) * 320); }
  #card .hint { position: absolute; bottom: calc(var(--u) * 40); font-size: calc(var(--fu) * 12); color: #aab; }
  #card .star { font-size: calc(var(--fu) * 26); color: #ffd84d; margin-bottom: calc(var(--u) * 12); }
  #card .btn { margin-top: calc(var(--u) * 30); }
  #card .tag { width: calc(var(--u) * 220); margin-bottom: calc(var(--u) * 26); }
  #card .intro { font-size: calc(var(--fu) * 19); font-weight: bold; width: calc(var(--u) * 320); line-height: 1.6; }

  /* タイトル画面 */
  #title { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; }

  #title .logo .tag { font-size: calc(var(--fu) * 13); margin-top: calc(var(--u) * 8); }
  #title .menu { position: absolute; bottom: calc(var(--u) * 92); display: flex; flex-direction: column; gap: calc(var(--u) * 12); align-items: center; }
  .btn {
    font: inherit; font-size: calc(var(--fu) * 18); font-weight: bold; width: calc(var(--u) * 220);
    padding: calc(var(--u) * 12); border-radius: calc(var(--u) * 26);
    background: #ffd84d; color: #1f3b6e; border: calc(var(--u) * 3) solid #fff; cursor: pointer;
    box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 10) rgba(0,0,0,.4);

</style>
</head>
<body>
<div id="stage">
  <svg id="bg" class="layer" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice"></svg>
  <svg id="chars" class="layer" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice"></svg>
  <svg id="view" class="layer" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" style="display:none"></svg>

  <div id="ui"></div>
  <div id="tip">新人バイトのミンくん</div>
  <div id="clock"><div class="now">--:--</div><div class="left">受け取り 19:00 まで</div></div>

  <div id="topbar">
    <button class="tbtn" id="btnLog">ログ</button>
    <button class="tbtn" id="btnMenu">メニュー</button>
    <button class="tbtn" id="btnSound">音 ON</button>
  </div>

  <div id="textbox"><div id="name"></div><div id="text"></div><div id="next"></div></div>
  <div id="choices"></div>
  <div id="card"></div>

  <div id="title">
    <div class="logo">
      <div class="big">星空マートの<br>クリスマス</div>
      <div class="tag">— ある日のコンビニの、ちいさな物語 —</div>
    </div>
    <div class="menu">
      <button class="btn" id="btnStart">はじめる</button>
      <button class="btn sub" id="btnSoundTitle">サウンド：ON</button>
    </div>
    <div class="notice">登場する店舗・人物はすべて架空です</div>
  </div>

  <div class="overlay" id="logView">
    <div class="ov-head"><span>会話ログ</span><button class="tbtn" id="btnLogClose">閉じる</button></div>
    <div id="logList"></div>
  </div>
  <div class="overlay" id="menuView">
    <div class="ov-head"><span>メニュー</span><button class="tbtn" id="btnMenuClose">閉じる</button></div>
    <div id="menuBox">
      <button class="btn" id="btnRestart">最初から</button>
      <button class="btn" id="btnToTitle">タイトルへ</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   サウンド（WebAudio）。使えない環境では何もしない。
   ========================================================= */
const Sound = (() => {
  let ctx = null, master = null, bgmBus = null, sfxBus = null;
  let enabled = true, cur = null, timer = null, nextT = 0, step = 0;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = enabled ? 0.8 : 0; master.connect(ctx.destination);
        bgmBus = ctx.createGain(); bgmBus.gain.value = 0.32; bgmBus.connect(master);
        sfxBus = ctx.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(master);
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    } catch (e) { ctx = null; }
  }
  function tone(f, t, dur, type, vol, bus, slide) {
    if (!ctx) return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  // ベル風の音（基音＋倍音）
  function bell(m, t, dur, vol, bus) {
    tone(mtof(m), t, dur, 'sine', vol, bus);
    tone(mtof(m) * 2.01, t, dur * 0.5, 'sine', vol * 0.35, bus);
  }

  /* BGM：8分音符単位のループ。mel=メロディ, bass=ベース（MIDI番号, null=休符） */
  const C = 60;
  const BGM = {
    title: { bpm: 84, inst: 'bell',
      mel:  [76,79,84,79, 76,79,84,79, 76,81,84,81, 76,81,84,81, 77,81,84,81, 74,77,81,77, 74,79,83,79, 71,74,79,74],
      bass: [48,null,null,null,55,null,null,null, 45,null,null,null,52,null,null,null, 41,null,null,null,50,null,null,null, 43,null,null,null,47,null,null,null] },
    shop: { bpm: 112, inst: 'pluck',
      mel:  [72,null,76,79, 77,76,74,null, 72,null,76,79, 81,null,79,null, 77,null,81,84, 83,81,79,null, 77,76,74,72, 74,null,null,null],
      bass: [48,null,55,null,48,null,55,null, 45,null,52,null,45,null,52,null, 41,null,48,null,41,null,48,null, 43,null,50,null,43,null,47,null] },
    busy: { bpm: 140, inst: 'pluck',
      mel:  [79,77,76,77, 79,null,79,null, 77,76,74,76, 77,null,77,null, 76,74,72,74, 76,79,84,null, 83,81,79,77, 76,74,72,null],
      bass: [48,55,48,55,48,55,48,55, 43,50,43,50,43,50,43,50, 45,52,45,52,41,48,41,48, 43,50,43,50,48,55,48,null] },
    tense: { bpm: 96, inst: 'tick',
      mel:  [81,null,null,null,null,null,80,null, 81,null,null,null,null,null,76,null, 77,null,null,null,null,null,76,null, 74,null,null,null,76,null,null,null],
      bass: [45,45,45,45,45,45,45,45, 41,41,41,41,41,41,41,41, 38,38,38,38,38,38,38,38, 40,40,40,40,40,40,40,40] },
    eve: { bpm: 76, inst: 'bell',
      mel:  [76,null,79,81, 79,null,76,null, 74,null,72,74, 76,null,null,null, 77,null,81,84, 83,null,81,79, 77,null,74,76, 72,null,null,null],
      bass: [48,null,55,null,52,null,55,null, 43,null,50,null,48,null,55,null, 41,null,48,null,45,null,52,null, 43,null,50,null,48,null,55,null] }
  };
  function playStep(b, i, t, len) {
    const m = b.mel[i % b.mel.length], ba = b.bass[i % b.bass.length];
    if (m != null) {
      if (b.inst === 'bell') bell(m, t, len * 3, 0.16, bgmBus);
      else if (b.inst === 'tick') tone(mtof(m), t, len * 1.5, 'triangle', 0.10, bgmBus);
      else tone(mtof(m), t, len * 1.2, 'triangle', 0.16, bgmBus);
    }
    if (ba != null) {
      if (b.inst === 'tick') tone(mtof(ba), t, len * 0.6, 'square', 0.05, bgmBus);
      else tone(mtof(ba), t, len * 1.8, 'sine', 0.22, bgmBus);
    }
  }
  function sched() {
    if (!ctx || !cur) return;
    const b = BGM[cur], len = 60 / b.bpm / 2;
    while (nextT < ctx.currentTime + 0.2) { playStep(b, step, nextT, len); step++; nextT += len; }
  }
  function bgm(name) {
    if (name === cur) return;
    cur = name || null; step = 0;
    if (timer) { clearInterval(timer); timer = null; }
    if (!ctx || !cur) return;
    nextT = ctx.currentTime + 0.1;
    timer = setInterval(sched, 40);
  }
  function se(name) {
    if (!ctx || !enabled) return;
    const t = ctx.currentTime + 0.01;
    switch (name) {
      case 'click': tone(1046, t, 0.06, 'sine', 0.15); break;
      case 'door': bell(88, t, 0.6, 0.22); bell(84, t + 0.32, 0.9, 0.22); break;
      case 'beep': tone(1760, t, 0.08, 'square', 0.06); break;
      case 'ok': tone(1318, t, 0.09, 'square', 0.06); tone(1760, t + 0.11, 0.16, 'square', 0.06); break;
      case 'phone':
        for (let r = 0; r < 2; r++) for (let k = 0; k < 10; k++)
          tone(k % 2 ? 1320 : 1100, t + r * 0.7 + k * 0.045, 0.045, 'triangle', 0.10);
        break;
      case 'shock': tone(220, t, 0.6, 'sawtooth', 0.12, null, 0.35); tone(110, t, 0.7, 'sine', 0.25, null, 0.5); break;
      case 'bell': [84, 88, 91, 96].forEach((m, k) => bell(m, t + k * 0.09, 0.8, 0.14)); break;
      case 'car': tone(90, t, 0.9, 'sawtooth', 0.06, null, 1.6); break;
    }
  }
  function setEnabled(v) {
    enabled = v;
    if (master) try { master.gain.setTargetAtTime(v ? 0.8 : 0, ctx.currentTime, 0.05); } catch (e) {}
  }
  return { init, bgm, se, setEnabled, get enabled() { return enabled; } };
})();

/* =========================================================
   絵（SVG）。キャラクターは丸い頭＋丸みのある胴体の人形。
   ========================================================= */
const ART = (() => {
  const INK = '#2b2b2b';
  // 表情：目と口だけ。（焦りのみ汗のしずくを添える）
  function face(f) {
    const E = (x, r) => `<circle cx="${x}" cy="-6" r="${r}" fill="${INK}"/>`;
    const W = (x, r, p) => `<circle cx="${x}" cy="-6" r="${r}" fill="#fff" stroke="${INK}" stroke-width="2.5"/><circle cx="${x}" cy="-5" r="${p}" fill="${INK}"/>`;
    switch (f) {
      case 'smile': return `<path d="M-26,-4 Q-18,-14 -10,-4 M10,-4 Q18,-14 26,-4" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
        <path d="M-13,11 Q0,30 13,11 Z" fill="#c4544c" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
      case 'aseri': return W(-18, 8, 3) + W(18, 8, 3) +
        `<path d="M-12,18 l4,-4 l4,4 l4,-4 l4,4 l4,-4 l4,4" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
         <path d="M44,-30 q-8,12 -6,16 a6,6 0 0 0 12,0 q2,-4 -6,-16 Z" fill="#8fd3ff" stroke="#3b8fc4" stroke-width="1.5"/>`;
      case 'komari': return `<ellipse cx="-18" cy="-3" rx="5" ry="4.5" fill="${INK}"/><ellipse cx="18" cy="-3" rx="5" ry="4.5" fill="${INK}"/>
        <path d="M-10,20 Q0,12 10,20" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
      case 'naki': return `<path d="M-26,-8 Q-18,0 -10,-8 M10,-8 Q18,0 26,-8" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
        <rect x="-21" y="-3" width="6" height="22" rx="3" fill="#7cc6f2"/><rect x="15" y="-3" width="6" height="22" rx="3" fill="#7cc6f2"/>
        <path d="M-11,22 Q0,8 11,22 Z" fill="#c4544c" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
      case 'odoroki': return W(-18, 9, 3.5) + W(18, 9, 3.5) +
        `<ellipse cx="0" cy="17" rx="6.5" ry="8.5" fill="#c4544c" stroke="${INK}" stroke-width="2.5"/>`;
      default: return E(-18, 5.5) + E(18, 5.5) +
        `<path d="M-8,14 Q0,20 8,14" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
    }
  }
  const UNI = '#2b7f8e', UNI_D = '#1f6170';
  // 制服（星空マートのベスト）
  const uniform = (tag) => `<rect x="-55" y="-215" width="110" height="138" rx="30" fill="#fdfdfd"/>
    <path d="M-55,-185 Q-55,-215 -25,-215 L-12,-215 L-6,-150 L6,-150 L12,-215 L25,-215 Q55,-215 55,-185 L55,-107 Q55,-77 25,-77 L-25,-77 Q-55,-77 -55,-107 Z" fill="${UNI}"/>
    <path d="M-34,-176 l3,6 6,1 -4.5,4 1,6 -5.5,-3 -5.5,3 1,-6 -4.5,-4 6,-1 Z" fill="#ffd84d"/>
    ${tag ? `<rect x="10" y="-182" width="34" height="16" rx="4" fill="#fff"/><text x="27" y="-170" font-size="11" text-anchor="middle" font-weight="bold" fill="${UNI_D}">${tag}</text>` : ''}`;
  const C = {
    senpai: { skin: '#f1c7a0', name: '先輩',
      body: () => uniform(''), sleeve: UNI, pants: '#3b3f4a',
      hair: `<path d="M-57,-266 C-62,-334 62,-334 57,-266 C50,-290 30,-300 4,-296 C-20,-300 -46,-292 -57,-266 Z" fill="#4a3426"/>
             <path d="M4,-296 C12,-286 30,-282 48,-284" fill="none" stroke="#33231a" stroke-width="3" stroke-linecap="round"/>` },
    min: { skin: '#e2b48a', name: 'ミン',
      body: () => uniform('ミン') + `<rect x="14" y="-162" width="26" height="12" rx="3" fill="#ffd84d"/><text x="27" y="-153" font-size="7.5" text-anchor="middle" font-weight="bold" fill="#5a4a00">研修中</text>`, sleeve: UNI, pants: '#3b3f4a',
      hair: `<path d="M-58,-262 C-64,-338 64,-338 58,-262 C54,-276 50,-284 44,-288 C36,-280 28,-282 22,-292 C14,-282 4,-284 -2,-294 C-10,-282 -22,-284 -28,-292 C-34,-282 -46,-282 -58,-262 Z" fill="#1d1d24"/>` },
    tencho: { skin: '#efc196', name: '店長',
      body: () => uniform('店長'), sleeve: UNI, pants: '#2f333c',
      hair: `<path d="M-57,-268 C-60,-322 60,-322 57,-268 C52,-284 44,-294 30,-300 C10,-306 -10,-306 -30,-300 C-44,-294 -52,-284 -57,-268 Z" fill="#8a8d93"/>` },
    chiku: { skin: '#eabf98', name: '地区担当',
      body: () => `<rect x="-55" y="-215" width="110" height="138" rx="30" fill="#2c3e66"/>
        <path d="M-16,-215 L0,-170 L16,-215 Z" fill="#fff"/><path d="M-4,-205 L4,-205 L6,-160 L0,-152 L-6,-160 Z" fill="#c0392b"/>
        <rect x="18" y="-190" width="22" height="5" rx="2" fill="#dfe6f2"/>`,
      sleeve: '#2c3e66', pants: '#24324f',
      hair: `<path d="M-57,-266 C-60,-330 60,-330 57,-266 C50,-292 20,-304 -10,-300 C-34,-296 -50,-286 -57,-266 Z" fill="#2a221d"/>` },
    owner: { skin: '#f3cfae', name: 'オーナー',
      body: () => `<rect x="-58" y="-215" width="116" height="140" rx="32" fill="#d23a3a"/>
        <rect x="-8" y="-215" width="16" height="140" fill="#fff" opacity=".95"/>
        <rect x="-58" y="-112" width="116" height="16" fill="#2b2b2b"/><rect x="-12" y="-114" width="24" height="20" rx="3" fill="#ffd84d"/>`,
      sleeve: '#d23a3a', cuff: '#fff', pants: '#d23a3a',
      // 白いひげは口の下（あご）だけ
      under: `<path d="M-50,-250 C-52,-200 -20,-188 0,-188 C20,-188 52,-200 50,-250 C40,-226 20,-222 0,-222 C-20,-222 -40,-226 -50,-250 Z" fill="#fafafa" stroke="#ddd" stroke-width="2"/>`,
      hair: `<path d="M-60,-292 C-50,-350 30,-366 70,-330 C80,-322 84,-306 82,-290 L60,-298 Z" fill="#d23a3a"/>
             <circle cx="84" cy="-288" r="11" fill="#fff"/>
             <rect x="-62" y="-306" width="124" height="22" rx="11" fill="#fff"/>` },
    parent: { skin: '#f2c8a4', name: 'お客さん',
      body: () => `<rect x="-55" y="-215" width="110" height="138" rx="30" fill="#c9a77c"/>
        <rect x="-40" y="-222" width="80" height="22" rx="11" fill="#b8423e"/><rect x="18" y="-206" width="16" height="40" rx="7" fill="#b8423e"/>
        <circle cx="0" cy="-160" r="4" fill="#8a6a45"/><circle cx="0" cy="-130" r="4" fill="#8a6a45"/>`,
      sleeve: '#c9a77c', pants: '#55505a',
      hair: `<path d="M-60,-240 C-70,-340 70,-340 60,-240 C58,-262 54,-282 44,-292 C20,-300 -20,-300 -44,-292 C-54,-282 -58,-262 -60,-240 Z" fill="#6b4630"/>` },
    child: { skin: '#f6d2b0', name: '子ども', scale: 0.74,
      body: () => `<rect x="-55" y="-215" width="110" height="138" rx="30" fill="#f2b632"/>
        <circle cx="-2" cy="-170" r="5" fill="#fff"/><circle cx="-2" cy="-140" r="5" fill="#fff"/>`,
      sleeve: '#f2b632', pants: '#4f6fa8',
      hair: `<path d="M-58,-276 C-58,-342 58,-342 58,-276 Z" fill="#3e9b6a"/>
             <rect x="-60" y="-288" width="120" height="18" rx="9" fill="#fff" opacity=".9"/>
             <circle cx="0" cy="-334" r="13" fill="#fff"/>` }
  };
  function doll(id, f) {
    const c = C[id];
    const cuff = c.cuff ? `<rect x="-80" y="-128" width="30" height="12" rx="6" fill="${c.cuff}"/><rect x="50" y="-128" width="30" height="12" rx="6" fill="${c.cuff}"/>` : '';
    return `
      <rect x="-40" y="-92" width="34" height="92" rx="16" fill="${c.pants}"/>
      <rect x="6" y="-92" width="34" height="92" rx="16" fill="${c.pants}"/>
      <rect x="-80" y="-206" width="30" height="96" rx="15" fill="${c.sleeve}"/>
      <rect x="50" y="-206" width="30" height="96" rx="15" fill="${c.sleeve}"/>
      ${cuff}
      <circle cx="-65" cy="-106" r="16" fill="${c.skin}"/><circle cx="65" cy="-106" r="16" fill="${c.skin}"/>
      ${c.body()}
      <ellipse cx="0" cy="-266" rx="57" ry="53" fill="${c.skin}"/>
      ${c.under || ''}
      <g transform="translate(0,-262)">${face(f)}</g>
      ${c.hair}`;
  }

  /* ---------- 背景 ---------- */
  const deco = `<path d="M0,72 Q45,96 90,72 T180,72 T270,72 T360,72" fill="none" stroke="#2f8a4e" stroke-width="9" stroke-linecap="round"/>
    ${[20, 70, 120, 170, 220, 270, 320].map((x, i) => `<circle cx="${x}" cy="${78 + (i % 2) * 8}" r="6" fill="${['#e74c3c', '#ffd84d', '#ffffff'][i % 3]}"/>`).join('')}`;
  const banner = `<rect x="0" y="0" width="360" height="58" fill="#1f3b6e"/>
    <path d="M22,18 l4,8 9,1 -6.5,6 1.5,9 -8,-4.5 -8,4.5 1.5,-9 -6.5,-6 9,-1 Z" fill="#ffd84d"/>
    <text x="40" y="37" font-size="17" font-weight="bold" fill="#fff" letter-spacing="1">星空マート</text>`;
  function products(y) {
    let s = '', x = 22, k = 0;
    const cols = ['#e86a5a', '#f2b632', '#5aa9e6', '#7cc47c', '#c88fd8', '#f5f0e6', '#ff9f6b'];
    while (x < 330) { const w = 18 + (k * 7) % 14, h = 26 + (k * 11) % 20; s += `<rect x="${x}" y="${y - h}" width="${w}" height="${h}" rx="3" fill="${cols[k % cols.length]}"/>`; x += w + 4; k++; }
    return s;
  }
  const BG = {
    register: () => `<rect width="360" height="640" fill="#f3ede2"/>${banner}
      <rect x="0" y="110" width="360" height="250" fill="#e4dacb"/>
      ${[170, 240, 310].map(y => products(y) + `<rect x="14" y="${y}" width="332" height="7" fill="#a8957a"/>`).join('')}
      ${deco}
      <rect x="20" y="96" width="98" height="64" rx="6" fill="#fff" stroke="#c0392b" stroke-width="3"/>
      <text x="69" y="118" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">クリスマスケーキ</text>
      <text x="69" y="134" font-size="11" font-weight="bold" fill="#1f3b6e" text-anchor="middle">ご予約受付中</text>
      <rect x="54" y="140" width="30" height="14" rx="3" fill="#f7e1e1"/><rect x="66" y="134" width="6" height="7" fill="#e74c3c"/>
      <rect x="0" y="360" width="360" height="280" fill="#d8cfc0"/>
      ${[0, 60, 120, 180, 240, 300].map(x => `<line x1="${x}" y1="360" x2="${x}" y2="640" stroke="#cbc1b0" stroke-width="2"/>`).join('')}
      <rect x="0" y="418" width="360" height="222" fill="#3a5683"/><rect x="0" y="406" width="360" height="18" rx="4" fill="#cdb894"/>
      <rect x="230" y="352" width="96" height="56" rx="8" fill="#5b6270"/><rect x="240" y="360" width="56" height="30" rx="4" fill="#9fe0c8"/>
      <rect x="302" y="362" width="16" height="36" rx="4" fill="#3d434f"/>`,
    shelf: () => `<rect width="360" height="640" fill="#efe7d8"/>${banner}${deco}
      <rect x="40" y="104" width="280" height="40" rx="8" fill="#c0392b"/>
      <text x="180" y="131" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">ご予約品 お渡し棚</text>
      <rect x="30" y="150" width="300" height="300" rx="6" fill="#b48c62"/><rect x="40" y="160" width="280" height="280" fill="#f7f1e6"/>
      ${[240, 330, 420].map(y => `<rect x="36" y="${y}" width="288" height="10" fill="#b48c62"/>`).join('')}
      ${[[50, 240], [140, 240], [230, 240], [50, 330], [230, 330], [50, 420], [140, 420], [230, 420]].map(([x, y], i) =>
        `<rect x="${x + 4}" y="${y - 64}" width="78" height="62" rx="4" fill="#fff" stroke="#d7cdbd" stroke-width="2"/>
         <rect x="${x + 39}" y="${y - 64}" width="8" height="62" fill="#e74c3c"/><rect x="${x + 4}" y="${y - 38}" width="78" height="8" fill="#e74c3c"/>
         <rect x="${x + 10}" y="${y - 16}" width="30" height="11" fill="#ffd84d"/><text x="${x + 25}" y="${y - 7}" font-size="8" text-anchor="middle" fill="#333">No.${12 + i}</text>`).join('')}
      <rect x="146" y="268" width="74" height="58" rx="4" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/>
      <rect x="150" y="300" width="66" height="22" rx="3" fill="#fff" stroke="#c0392b" stroke-width="2"/>
      <text x="183" y="315" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#c0392b">アレルギー対応</text>
      <rect x="0" y="450" width="360" height="190" fill="#d8cfc0"/>`,
    backyard: () => `<rect width="360" height="640" fill="#cfd6df"/>

const $ = id => document.getElementById(id);
const st = { i: 0, flags: {}, log: [], shown: [], faces: {}, typing: null, full: '', busy: false, mode: 'title', clock: null };

function fit() {
  const w = Math.min(window.innerWidth, window.innerHeight * 9 / 16);
  $('stage').style.setProperty('--w', Math.floor(w) + 'px');
  // 端末の文字サイズ設定で文字が拡大されていたら、その分を打ち消す
  try {
    const pr = document.createElement('span');
    pr.textContent = 'あああああ';
    pr.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font-size:100px;line-height:1;';
    $('stage').appendChild(pr);
    const pw = pr.getBoundingClientRect().width; pr.remove();
    const k = pw > 0 ? Math.min(1, 500 / pw) : 1;
    $('stage').style.setProperty('--fk', k < 0.92 ? k.toFixed(3) : '1');
  } catch (e) {}
}
window.addEventListener('resize', fit); fit();

function check(c) { if (!c) return true; const [k, v] = c.split('='); return st.flags[k] === v; }

function drawChars(enterIds) {
  const ids = st.shown, n = ids.length;
  const scale = n <= 2 ? 1 : n === 3 ? 0.84 : 0.64;
  const baseY = n <= 2 ? 545 : 520;
  const xs = n === 1 ? [180] : n === 2 ? [105, 255] : n === 3 ? [66, 180, 294] : [48, 136, 224, 312];
  const speakerId = st.speaker;
  $('chars').innerHTML = ids.map((id, k) => {
    const c = ART.chars[id], s = scale * (c.scale || 1);
    const dim = speakerId && speakerId !== id ? ' dim' : '';
    const enter = enterIds && enterIds.includes(id) ? ' enter' : '';
    return `<g class="ch${dim}${enter}" data-id="${id}"><g transform="translate(${xs[k]},${baseY}) scale(${s})">${ART.doll(id, st.faces[id] || 'normal')}</g></g>`;
  }).join('');
}

function setView(v) {
  const el = $('view');
  if (!v) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.innerHTML = ART.view(v);
  el.style.display = 'block';
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
}

function setClock(v) {
  const el = $('clock');
  if (!v) { el.style.display = 'none'; st.clock = null; return; }
  st.clock = v;
  const [h, m] = v.split(':').map(Number);
  const left = 19 * 60 - (h * 60 + m);
  el.style.display = 'block';
  el.querySelector('.now').textContent = v;
  el.querySelector('.left').textContent = left > 0 ? `受け取りまで あと ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '受け取りの時間';
  el.classList.toggle('urgent', left <= 30);
  el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
}

function addLog(entry) { st.log.push(entry); }

function showText(step) {
  const who = step.who || '';
  const id = NAME2ID[who];
  // 表情は「本人が話す行」か「反応(r)の指定がある行」だけ。それ以外は普通に戻す
  const keepOwn = id && !step.f && st.lastSpeaker === id;
  st.shown.forEach(c => { if (!(keepOwn && c === id)) st.faces[c] = 'normal'; });
  if (id && step.f) st.faces[id] = step.f;
  if (step.r) Object.assign(st.faces, step.r);
  st.lastSpeaker = id || null;
  st.speaker = id || null;
  // ミンくんの初登場時だけ案内カード（次のタップで消える）
  const showTip = !st.minTipDone && st.shown.includes('min');
  if (showTip) st.minTipDone = true;
  $('tip').style.display = showTip ? 'block' : 'none';
  drawChars();
  st.pendingNod = step.nod || null;
  $('name').textContent = who;
  const t = $('text');
  t.classList.toggle('narr', !who);
  st.full = step.text;
  addLog({ who, text: step.text });
  $('next').style.display = 'none';
  let k = 0;
  t.textContent = '';
  clearInterval(st.typing);
  st.typing = setInterval(() => {
    k += 1; t.textContent = st.full.slice(0, k);
    if (k >= st.full.length) finishTyping();
  }, 28);
}
function finishTyping() {
  clearInterval(st.typing); st.typing = null;
  if (st.pendingNod) { const g = $('chars').querySelector(`g.ch[data-id="${st.pendingNod}"]`); if (g) g.classList.add('nod'); st.pendingNod = null; }
  $('text').textContent = st.full; $('next').style.display = 'block';
}

function run() {
  while (st.i < SCRIPT.length) {
    const s = SCRIPT[st.i];
    if (!check(s.c)) { st.i++; continue; }
    if (!s.keepUi && $('ui').style.display !== 'none') hideUi();
    if ('bg' in s) $('bg').innerHTML = ART.bg(s.bg);
    if ('bgm' in s) Sound.bgm(s.bgm);
    if ('clock' in s) setClock(s.clock);
    if (s.show) {
      const entering = s.show.filter(id => !st.shown.includes(id));
      s.show.forEach(id => { if (!st.shown.includes(id)) st.faces[id] = 'normal'; });
      st.shown = s.show.slice(); st.speaker = null; drawChars(entering);
    }
    if ('view' in s) setView(s.view);
    if (s.se) Sound.se(s.se);
    if (s.fx === 'shake') { const c = $('chars'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
    if (s.act || s.intro) { st.i++; showCard(s); return; }
    if (s.choice) { st.i++; showChoice(s); return; }
    if (s.end) { st.i++; showEnd(); return; }
    if (s.interact) { st.i++; ({ pos: showPos, shelf: showShelf, prep: showPrep })[s.interact](s); return; }
    if (s.text) { st.i++; st.mode = 'text'; showText(s); return; }
    st.i++;
  }
}

function showCard(s) {
  st.mode = 'card'; $('tip').style.display = 'none';
  $('textbox').style.visibility = 'hidden';
  const c = $('card');
  if (s.intro) {
    c.innerHTML = `<svg class="tag" viewBox="0 0 220 110">${ART.nameTag}</svg><div class="intro">${s.intro}</div><div class="hint">タップで進む</div>`;
    addLog({ who: '', text: s.intro });
  } else {
    c.innerHTML = `<div class="star">★</div><div class="act">${s.act}</div><div class="sub">${s.sub}</div><div class="hint">タップで進む</div>`;
    addLog({ who: '', text: `── ${s.act}　${s.sub} ──` });
  }
  c.style.display = 'flex';
}
function closeCard() {
  $('card').style.display = 'none';
  $('textbox').style.visibility = 'visible';
  $('name').textContent = ''; $('text').textContent = '';
  run();
}

function showChoice(s) {
  st.mode = 'choice'; $('tip').style.display = 'none';
  $('next').style.display = 'none';
  const box = $('choices');
  box.innerHTML = (s.q ? `<div class="choice-q">${s.q}</div>` : '') +
    s.choice.map((o, k) => `<button class="choice" data-k="${k}">${o.t}</button>`).join('');
  box.style.display = 'flex';
  box.querySelectorAll('.choice').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const o = s.choice[+b.dataset.k];
    st.flags[o.set[0]] = o.set[1];
    addLog({ pick: true, text: `▶ ${o.t}` });
    Sound.se('click');
    box.style.display = 'none';
    run();
  }));
}

/* ---------- 操作画面 ---------- */
function hideUi() { const u = $('ui'); u.style.display = 'none'; u.innerHTML = ''; u.className = ''; st.prep = null; }
// 操作中にテキストボックスへ出す一言（タイプ表示なし）
function uiSay(who, text, log, guide) {
  clearInterval(st.typing); st.typing = null;
  $('textbox').style.visibility = 'visible';
  $('name').textContent = who; $('text').classList.toggle('narr', !who);
  st.full = text; $('text').textContent = text; $('next').style.display = 'none';
  if (guide) { const g = document.createElement('span'); g.className = 'guide'; g.textContent = guide; $('text').appendChild(g); }
  if (log) addLog({ who, text });
}

function showPos(s) {
  st.mode = 'interact'; $('tip').style.display = 'none';

      <div class="pos-sum">
        <div class="row"><span class="lb">商品</span><span class="val empty" id="v-item">未選択</span></div>
        <div class="row"><span class="lb">受け取り日</span><span class="val empty" id="v-date">未選択</span>
          <span class="lb">時間</span><span class="val empty" id="v-time">未選択</span></div>
      </div>
      <div class="pos-step" id="posStep"></div>
      <div class="pos-left">予約残数<b>残り 2</b></div>
      <button class="pos-send" id="posSend" disabled>送信</button>
    </div><svg class="memo-arrow" id="memoArrow"></svg>`;
  u.onclick = e => { e.stopPropagation(); Sound.init(); if (st.mode === 'text') advance(); };
  uiSay('', s.lead, true, '↑ 上の画面をタップして入力しよう');
  let k = 0;
  // 手順の見出しのそばから、メモを指す矢印（どの手順でも同じ位置）
  const arrow = () => {
    const a = $('memoArrow'), q = document.querySelector('#posStep .q'), m = document.querySelector('#ui .memo');
    if (!q) { a.innerHTML = ''; return; }
    const U = u.getBoundingClientRect(), Q = q.getBoundingClientRect(), M = m.getBoundingClientRect();
    const sc = U.width / 360, X = v => (v - U.left) / sc, Y = v => (v - U.top) / sc;
    a.setAttribute('viewBox', `0 0 360 ${U.height / sc}`);
    const y0 = Y(Q.top + Q.height / 2), x0 = X(Q.left) - 2, xr = 8, yt = Y(M.bottom) + 3;
    const path = `M${x0},${y0} L${xr},${y0} L${xr},${yt + 9}`;
    a.innerHTML = `<path d="${path}" fill="none" stroke="#5a3d00" stroke-width="8" stroke-linejoin="round"/>

      <path d="M${xr - 8},${yt + 12} L${xr},${yt} L${xr + 8},${yt + 12} Z" fill="#ffc21a" stroke="#5a3d00" stroke-width="1.5" stroke-linejoin="round"/>`;
  };
  const render = () => {
    const box = $('posStep');

    const P = POS_STEPS[k];
    box.innerHTML = `<div class="q">${P.q}</div><div class="opts${P.opts.length === 3 ? ' row' : ''}">` +
      P.opts.map(o => `<button class="opt" data-v="${o[0]}">${o[1] ? `<span class="no">${o[0]}</span>${o[1]}` : o[0]}</button>`).join('') + '</div>';
    arrow();
    box.querySelectorAll('.opt').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      if (b.dataset.v !== P.ans) {
        Sound.se('click');
        b.classList.remove('ng'); void b.offsetWidth; b.classList.add('ng');
        uiSay('先輩', P.ng, true, '↑ 上の画面をタップして入力しよう');
        return;
      }
      Sound.se('beep');
      const v = $('v-' + P.key); v.classList.remove('empty');
      v.textContent = P.opts.find(o => o[0] === P.ans).join(' ');
      k++; render();
      if (k >= POS_STEPS.length) { uiSay('先輩', s.done, true, '↑ 「送信」をタップしよう'); $('posSend').disabled = false; }
      else uiSay('', s.lead, false, '↑ 上の画面をタップして入力しよう');
    }));
  };
  render();
  $('posSend').addEventListener('click', e => {
    e.stopPropagation();
    if ($('posSend').disabled) return;
    hideUi(); run();
  });
}

// 第三幕：予約棚の確認（プレイヤーが操作）
// 並びはばらばら。XM-0024 はこの1枚だけ（箱がない）
const SHELF_TAGS = [['XM-0042', '19:00', 1], ['XM-0021', '19:30', 1], ['XM-0012', '18:00', 1],
  ['XM-0023', '20:00', 1], ['XM-0022', '19:00', 1], ['XM-0204', '19:00', 1],
  ['XM-0021', '17:00', 1], ['XM-0024', '19:00', 0], ['XM-0042', '17:30', 1],
  ['XM-0023', '18:30', 1], ['XM-0021', '19:00', 1], ['XM-0022', '18:00', 1]];
function showShelf() {
  st.mode = 'interact'; $('tip').style.display = 'none';
  uiSay('', '', false, '↑ 予約票をタップして探そう');
  const box = `<svg viewBox="0 0 84 30"><rect x="20" y="3" width="44" height="26" rx="3" fill="#fff" stroke="#c9d6df" stroke-width="1.5"/>
    <rect x="39" y="3" width="6" height="26" fill="#e74c3c"/><rect x="20" y="13" width="44" height="5" fill="#e74c3c"/></svg>`;
  // 確認する前は、12か所とも同じ暗い枠（中身は描かない）
  const slot = (t, i) => `<div class="slot" data-i="${i}"><div class="spot"></div><button class="ptag">${t[0]}<br>${t[1]}</button></div>`;
  const u = $('ui'); u.className = 'ui-shelf'; u.style.display = 'block';
  u.innerHTML = `<div class="shelf-sign">ウォーク（予約品）</div><div class="shelf-hint">XM-0024、19:00の予約を探そう</div>
    <div class="shelf">${[0, 3, 6, 9].map(r => `<div class="shelf-row">${SHELF_TAGS.slice(r, r + 3).map((t, i) => slot(t, r + i)).join('')}</div>`).join('')}</div>
    <svg class="breath" viewBox="0 0 70 90"><defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
      <g filter="url(#bl)">${[0, 1, 2].map(k => `<ellipse cx="${28 + k * 6}" cy="80" rx="${13 + k * 5}" ry="${8 + k * 3}" fill="#ffffff" opacity="0">
      <animate attributeName="cy" values="82;24" dur="3s" begin="-${k}s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="3s" begin="-${k}s" repeatCount="indefinite"/></ellipse>`).join('')}</g></svg>`;
  u.onclick = e => { e.stopPropagation(); Sound.init(); if (st.mode === 'text') advance(); };
  u.querySelectorAll('.slot').forEach(el => el.querySelector('.ptag').addEventListener('click', e => {
    e.stopPropagation();
    if (st.mode !== 'interact') { if (st.mode === 'text') advance(); return; }
    const t = SHELF_TAGS[+el.dataset.i], b = el.querySelector('.ptag'), spot = el.querySelector('.spot');
    if (!b.classList.contains('done')) {
      b.classList.add('done');
      spot.classList.add('lit'); if (t[2]) spot.innerHTML = box;   // 明るくなって中身が見える
      el.insertAdjacentHTML('beforeend', `<div class="mark${t[2] ? '' : ' miss'}">${t[2] ? '✓' : '！'}</div>`);
    }
    if (t[2]) { Sound.se('click'); uiSay('', 'これじゃない。', false, '↑ 予約票をタップして探そう'); return; }
    // XM-0024：予約票だけで箱がない → 次のタップで「……え？」
    Sound.se('shock');
    uiSay('', '……ない。', true);
    st.mode = 'text'; $('next').style.display = 'block';
  }));
}

// 第五幕：ケーキの準備（プレイヤーがミンくんに指示する）
const PREP_ITEMS = {
  cake:   { x: 14,  y: 116, w: 108, h: 84, label: 'ケーキの箱',
    svg: `<svg viewBox="0 0 100 70"><rect x="14" y="8" width="72" height="56" rx="4" fill="#fff" stroke="#c9d6df" stroke-width="2"/><rect x="47" y="8" width="7" height="56" fill="#e74c3c"/><rect x="14" y="30" width="72" height="7" fill="#e74c3c"/><rect x="20" y="46" width="42" height="13" rx="2" fill="#ffd84d"/><text x="41" y="56" font-size="9" font-weight="bold" text-anchor="middle" fill="#333">XM-0024</text></svg>` },
  pkg:    { x: 128, y: 116, w: 108, h: 84, label: 'ギフト用パッケージ',
    svg: `<svg viewBox="0 0 100 70"><path d="M38,18 Q50,2 62,18" fill="none" stroke="#2f8a4e" stroke-width="4"/><rect x="18" y="18" width="64" height="48" rx="4" fill="#c0392b"/><rect x="46" y="18" width="8" height="48" fill="#2f8a4e"/><path d="M50,32 l-10,-8 0,16 Z M50,32 l10,-8 0,16 Z" fill="#ffd84d"/><circle cx="30" cy="54" r="3" fill="#fff"/><circle cx="70" cy="44" r="2.5" fill="#fff"/></svg>` },
  candle: { x: 242, y: 116, w: 104, h: 84, label: 'ローソク',
    svg: `<svg viewBox="0 0 100 70"><rect x="22" y="40" width="56" height="24" rx="3" fill="#f2e6d0" stroke="#c9b48f" stroke-width="2"/>${[34, 50, 66].map((x, i) => `<rect x="${x - 3}" y="14" width="6" height="28" rx="2" fill="${['#e86a5a', '#5aa9e6', '#7cc47c'][i]}"/><path d="M${x},6 q4,5 0,9 q-4,-4 0,-9 Z" fill="#ffb400"/>`).join('')}</svg>` },
  ichigo2:{ x: 14,  y: 210, w: 92,  h: 88, label: 'いちご 2個パック',
    svg: `<svg viewBox="0 0 100 70"><rect x="16" y="22" width="68" height="40" rx="6" fill="#eaf6ff" stroke="#9fc3dc" stroke-width="2"/>${[38, 62].map(x => `<path d="M${x},32 q-11,2 -9,14 q3,10 9,12 q6,-2 9,-12 q2,-12 -9,-14 Z" fill="#e23b3b"/><path d="M${x - 6},31 l6,-5 6,5 Z" fill="#2f8a4e"/>`).join('')}</svg>` },
  ichigo3:{ x: 112, y: 210, w: 92,  h: 88, label: 'いちご 3個パック',
    svg: `<svg viewBox="0 0 100 70"><rect x="10" y="22" width="80" height="40" rx="6" fill="#eaf6ff" stroke="#9fc3dc" stroke-width="2"/>${[28, 50, 72].map(x => `<path d="M${x},32 q-10,2 -8,13 q3,9 8,11 q5,-2 8,-11 q2,-11 -8,-13 Z" fill="#e23b3b"/><path d="M${x - 5},31 l5,-5 5,5 Z" fill="#2f8a4e"/>`).join('')}</svg>` },
  mugicha:{ x: 212, y: 210, w: 44,  h: 98, label: '麦茶',
    svg: `<svg viewBox="0 0 40 80"><rect x="14" y="4" width="12" height="8" rx="2" fill="#e8e8e8"/><path d="M12,12 h16 l4,10 v52 q0,4 -4,4 h-16 q-4,0 -4,-4 v-52 Z" fill="#d9a441" opacity=".9"/><rect x="8" y="38" width="24" height="16" fill="#fff"/><text x="20" y="49" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#7a5410">麦茶</text></svg>` },
  cola:   { x: 258, y: 210, w: 44,  h: 98, label: 'コーラ',
    svg: `<svg viewBox="0 0 40 80"><rect x="14" y="4" width="12" height="8" rx="2" fill="#c0392b"/><path d="M12,12 h16 l4,10 v52 q0,4 -4,4 h-16 q-4,0 -4,-4 v-52 Z" fill="#3a1d12"/><rect x="8" y="38" width="24" height="16" fill="#c0392b"/></svg>` },
  cocoa:  { x: 304, y: 210, w: 44,  h: 98, label: 'ココア',
    svg: `<svg viewBox="0 0 40 80"><rect x="9" y="20" width="22" height="56" rx="4" fill="#8a5a2b"/><rect x="9" y="20" width="22" height="6" rx="2" fill="#c9c9c9"/><rect x="9" y="70" width="22" height="6" rx="2" fill="#c9c9c9"/><path d="M14,46 q6,-8 12,0 q-6,8 -12,0 Z" fill="#f2e6d0"/></svg>` }
};
const HAND_REST = [[150, 98], [210, 98]];
function showPrep(s) {
  st.mode = 'interact'; $('tip').style.display = 'none';
  const u = $('ui');
  const guide = '↑ 机の上のものをタップしよう';
  if (s.part === 1 || !st.prep) {
    u.className = 'ui-prep'; u.style.display = 'block';
    u.innerHTML = `<div class="prep-h">次は何をする？ ミンくんに指示しよう</div>` +
      Object.entries(PREP_ITEMS).map(([id, it]) => `<button class="item" data-id="${id}" style="left:calc(var(--u)*${it.x});top:calc(var(--u)*${it.y});width:calc(var(--u)*${it.w});height:calc(var(--u)*${it.h})">${it.svg}<span>${it.label}</span></button>`).join('') +
      `<div class="hikae"><b>予約の控え</b>ケーキ　XM-0024<br>いちご　2個パック<br>ギフトドリンク　麦茶</div>
       <div class="hand" id="handL"></div><div class="hand" id="handR"></div>`;
    st.prep = { step: 0, sub: null, busy: false };
    const P = st.prep;
    const item = id => u.querySelector(`.item[data-id="${id}"]`);
    const center = id => { const it = PREP_ITEMS[id]; return [it.x + it.w / 2, it.y + it.h / 2]; };
    const hands = (l, r) => {
      $('handL').style.left = `calc(var(--u)*${l[0]})`; $('handL').style.top = `calc(var(--u)*${l[1]})`;
      $('handR').style.left = `calc(var(--u)*${r[0]})`; $('handR').style.top = `calc(var(--u)*${r[1]})`;
    };
    const rest = () => hands(HAND_REST[0], HAND_REST[1]);
    const toItem = id => { const [x, y] = center(id); hands([x - 16, y], [x + 16, y]); };
    const mark = id => { if (!item(id).querySelector('.mark')) item(id).insertAdjacentHTML('beforeend', '<div class="mark">✓</div>'); };
    const clearPick = () => u.querySelectorAll('.item.pick, .item.front').forEach(e => e.classList.remove('pick', 'front'));
    const ask = (text, hint) => uiSay('ミン', text, true, hint || guide);
    // 間違えたときに出す「次にやること」
    const HINTS = ['↑ まずは、ローソクがそろっているか確認しよう', '↑ 次は、付属のいちごを選ぼう',
      '↑ 次は、ケーキの箱をギフト用パッケージに入れよう', '↑ 最後は、ギフトドリンクを選ぼう'];
    const SUB_HINTS = { ichigo: '↑ 2個パックか3個パックをタップしよう', drink: '↑ 麦茶・コーラ・ココアのどれかをタップしよう' };
    const KOE = '↑ 予約の控えを見てみよう';
    const later = (ms, fn) => { P.busy = true; setTimeout(() => { if (st.prep === P) { P.busy = false; fn(); } }, ms); };
    const wrong = id => {
      Sound.se('click'); ask('これは、どうしますか？', P.sub ? SUB_HINTS[P.sub] : HINTS[P.step]);
      if (!P.sub) { toItem(id); later(500, rest); }   // 両手で持っている間は手を離さない
    };
    P.tap = id => {
      if (P.busy) return;
      if (P.sub === 'ichigo') {
        if (id === 'ichigo2') { Sound.se('beep'); clearPick(); toItem('ichigo2'); P.sub = null; later(550, () => { mark('ichigo2'); rest(); P.step = 2; uiSay('', '', false, guide); }); }
        else if (id === 'ichigo3') { Sound.se('click'); ask('控えと、ちがいます', KOE); }
        else wrong(id);
        return;
      }
      if (P.sub === 'drink') {
        if (id === 'mugicha') { Sound.se('beep'); clearPick(); toItem('mugicha'); P.sub = null;
          later(550, () => { mark('mugicha'); rest(); P.step = 4; st.mode = 'text'; run(); }); }
        else if (id === 'cola' || id === 'cocoa') { Sound.se('click'); ask('控えと、ちがいます', KOE); }
        else wrong(id);
        return;
      }
      if (P.step === 0 && id === 'candle') {
        Sound.se('beep'); toItem('candle'); later(550, () => { mark('candle'); rest(); P.step = 1; uiSay('', '', false, guide); });
      } else if (P.step === 1 && (id === 'ichigo2' || id === 'ichigo3')) {
        // ミンくんが2個パックと3個パックを両手に持つ
        Sound.se('click'); P.sub = 'ichigo';
        hands(center('ichigo2'), center('ichigo3')); item('ichigo2').classList.add('pick'); item('ichigo3').classList.add('pick');
        ask('これはどっちですか？');
      } else if (P.step === 2 && (id === 'cake' || id === 'pkg')) {
        // ケーキの箱をギフト用パッケージへ
        Sound.se('beep'); toItem('cake');
        later(500, () => {
          const c = item('cake'), it = PREP_ITEMS.pkg;
          c.style.left = `calc(var(--u)*${it.x})`; c.style.top = `calc(var(--u)*${it.y})`; c.style.transform = 'scale(.5)';
          toItem('pkg');
          later(550, () => { c.classList.add('gone'); mark('pkg'); rest(); P.step = 3; st.mode = 'text'; run(); });
        });
      } else if (P.step === 3 && st.mode === 'interact' && (id === 'mugicha' || id === 'cola' || id === 'cocoa')) {
        // ミンくんが麦茶・コーラ・ココアを前に並べる
        Sound.se('click'); P.sub = 'drink';
        ['mugicha', 'cola', 'cocoa'].forEach(d => item(d).classList.add('pick', 'front'));
        hands([center('mugicha')[0], 150], [center('cocoa')[0], 150]);
        ask('これはどっちですか？');
      } else wrong(id);
    };
    u.onclick = e => { e.stopPropagation(); Sound.init(); if (st.mode === 'text') advance(); };
    u.querySelectorAll('.item').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      if (st.mode === 'text') { advance(); return; }
      if (st.mode === 'interact') st.prep.tap(b.dataset.id);
    }));
    rest();
  }
  uiSay('', '', false, guide);
}

function showEnd() {
  st.mode = 'end'; $('tip').style.display = 'none';
  Sound.bgm('title');
  $('textbox').style.visibility = 'hidden';
  const c = $('card');
  c.innerHTML = `<div class="star">★ Merry Christmas ★</div><div class="act">おわり</div>
    <div class="sub">遊んでくれて、ありがとうございました。</div>
    <button class="btn" id="btnEndTitle">タイトルへ</button>`;
  c.style.display = 'flex';
  $('btnEndTitle').addEventListener('click', e => { e.stopPropagation(); Sound.se('click'); toTitle(); });
}

function advance() {
  if (st.mode === 'text') { if (st.typing) finishTyping(); else run(); }
  else if (st.mode === 'card') closeCard();
}

function newGame() {
  Object.assign(st, { i: 0, flags: {}, log: [], shown: [], faces: {}, speaker: null, lastSpeaker: null, minTipDone: false });
  $('tip').style.display = 'none'; hideUi();
  setView(null);
  clearInterval(st.typing); st.typing = null;
  $('chars').innerHTML = ''; $('choices').style.display = 'none'; $('card').style.display = 'none';
  $('textbox').style.visibility = 'visible'; $('name').textContent = ''; $('text').textContent = '';
  setClock(null);
  $('title').style.display = 'none'; $('topbar').style.display = 'flex';
  run();
}
function toTitle() {
  clearInterval(st.typing); st.typing = null;
  st.mode = 'title';
  closeOverlays();
  $('bg').innerHTML = ART.bg('storefront'); $('chars').innerHTML = ''; setView(null); hideUi(); $('tip').style.display = 'none';
  $('choices').style.display = 'none'; $('card').style.display = 'none';
  $('textbox').style.visibility = 'hidden'; setClock(null);
  $('topbar').style.display = 'none'; $('title').style.display = 'flex';
  Sound.bgm('title');
}

function renderSoundBtns() {
  const on = Sound.enabled;
  $('btnSound').textContent = on ? '音 ON' : '音 OFF';
  $('btnSound').classList.toggle('off', !on);
  $('btnSoundTitle').textContent = on ? 'サウンド：ON' : 'サウンド：OFF';
}
function toggleSound(e) {
  e.stopPropagation(); Sound.init();
  Sound.setEnabled(!Sound.enabled); renderSoundBtns(); Sound.se('click');
}
function closeOverlays() { $('logView').classList.remove('show'); $('menuView').classList.remove('show'); }
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function openLog(e) {
  e.stopPropagation(); Sound.se('click');
  $('logList').innerHTML = st.log.map(l => l.pick
    ? `<div class="log-item pick">${esc(l.text)}</div>`
    : `<div class="log-item${l.who ? '' : ' narr'}">${l.who ? `<div class="who">${esc(l.who)}</div>` : ''}${esc(l.text).replace(/\n/g, '<br>')}</div>`).join('');
  $('logView').classList.add('show');
  const L = $('logList'); L.scrollTop = L.scrollHeight;
}

// 入力
$('stage').addEventListener('click', () => { Sound.init(); if (st.mode !== 'title') advance(); });
$('btnStart').addEventListener('click', e => { e.stopPropagation(); Sound.init(); Sound.se('click'); newGame(); });
$('btnSound').addEventListener('click', toggleSound);
$('btnSoundTitle').addEventListener('click', toggleSound);
$('btnLog').addEventListener('click', openLog);
$('btnMenu').addEventListener('click', e => { e.stopPropagation(); Sound.se('click'); $('menuView').classList.add('show'); });
$('btnLogClose').addEventListener('click', e => { e.stopPropagation(); closeOverlays(); });
$('btnMenuClose').addEventListener('click', e => { e.stopPropagation(); closeOverlays(); });
$('logView').addEventListener('click', e => e.stopPropagation());
$('menuView').addEventListener('click', e => e.stopPropagation());
$('btnRestart').addEventListener('click', e => { e.stopPropagation(); Sound.se('click'); closeOverlays(); newGame(); });
$('btnToTitle').addEventListener('click', e => { e.stopPropagation(); Sound.se('click'); toTitle(); });

// 起動：タイトル画面
renderSoundBtns();
$('bg').innerHTML = ART.bg('storefront');
$('textbox').style.visibility = 'hidden';
$('topbar').style.display = 'none';
</script>
</body>
</html>
